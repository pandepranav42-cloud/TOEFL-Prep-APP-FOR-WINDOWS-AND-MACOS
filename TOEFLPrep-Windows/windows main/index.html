["Measuring Unemployment", "Economics", 4, "An unemployment rate looks like a simple count and is not. The standard definition counts people without work who are available for work and have actively sought it recently, which excludes two large groups.\n\nThe first is discouraged workers, who want a job but have stopped looking because they expect to find none. They leave the labour force by definition, and their departure lowers the measured rate. A recession deep enough to discourage people can therefore improve the headline figure.\n\nThe second is the underemployed: part-time workers who want full-time hours, and people in jobs far below their qualifications. Both count as employed.\n\nStatistical agencies publish broader measures alongside the headline for exactly this reason, though the headline is the number that gets reported.", [["Why can a deep recession lower the measured unemployment rate?", "Employers hire more staff", "Part-time work is reclassified", "Agencies change the definition", "Discouraged workers stop looking and leave the labour force", 3, "Discouraged workers leave the labour force by definition, lowering the rate."], ["How are underemployed workers counted?", "They are not counted", "As unemployed", "As employed", "As outside the labour force", 2, "The passage states both groups count as employed."], ["Why do agencies publish broader measures?", "To satisfy legal requirements", "To compare countries", "Because the headline omits discouraged and underemployed workers", "To replace the headline figure", 2, "Broader measures exist for exactly the reasons the passage sets out."]]],
["Symbiosis in the Soil", "Botany", 3, "Most land plants are joined at the root to fungi, in a partnership called mycorrhiza that is older than forests and probably older than roots. The fungus threads through soil far finer than any root can penetrate and delivers phosphorus and water to the plant. The plant, which can photosynthesise and the fungus cannot, returns sugars.\n\nThe exchange is not automatic charity. Experiments in which one partner is starved show the other reduces its contribution, and plants direct more sugar to fungal strands that deliver more phosphorus. The relationship is regulated, and each side responds to what it receives.\n\nBecause a single fungal network may connect many plants, resources can move between individuals through it, though how much of this reflects deliberate transfer rather than leakage remains debated.", [["What does each partner contribute?", "The plant supplies water; the fungus supplies sugars", "The fungus supplies phosphorus and water; the plant supplies sugars", "Neither contributes directly", "Both contribute sugars", 1, "The fungus delivers phosphorus and water, the plant returns sugars."], ["What evidence shows the exchange is regulated?", "Roots grow towards fungi", "Starving one partner reduces the other's contribution", "Networks connect many plants", "The fungus grows faster in poor soil", 1, "Experiments show reduced contribution when a partner is starved, and sugar directed to better providers."], ["What remains debated according to the passage?", "Whether fungi photosynthesise", "Whether transfer between plants is deliberate or leakage", "Whether mycorrhizae exist", "Whether roots evolved first", 1, "The final clause identifies exactly this uncertainty."]]],
["The Cost of Monumental Building", "Anthropology", 4, "Monumental construction is expensive in a way that looks irrational. Moving stones weighing many tonnes without wheels or draught animals, as at Stonehenge or on Rapa Nui, consumed labour that could have produced food.\n\nSeveral explanations have been offered. Monuments may coordinate: a project requiring hundreds of workers for years demands organisation, and the organisation may outlast the project. They may signal, since a society able to waste labour on this scale advertises a surplus and, implicitly, a capacity to defend it. They may also simply be what the labour was for, in societies where obligation to work on communal projects was the form taxation took.\n\nWhat the explanations share is a refusal to treat the cost as waste. The expense is not incidental to the monument's function; in each account it is the function.", [["What puzzle does the passage address?", "Why societies spent so much labour on monuments", "Whether monuments were religious", "When Stonehenge was built", "How ancient people moved heavy stones", 0, "The passage asks why such expensive construction was undertaken."], ["According to the signalling explanation, a monument demonstrates", "engineering knowledge", "religious devotion", "population size alone", "a surplus and the capacity to defend it", 3, "A society able to waste labour on this scale advertises a surplus."], ["What do the explanations have in common?", "They treat the cost as accidental", "They reject archaeological evidence", "They treat the expense itself as the function", "They date the monuments precisely", 2, "The final sentence says the expense is the function in each account."]]],
["Reading the Ice", "Environmental science", 3, "An ice sheet is an archive. Snow falling on Antarctica or Greenland compacts into ice without melting, and each year's layer traps a sample of the atmosphere in bubbles along with dust, ash and pollen. Drilling a core and counting downward reads the record backwards, in places for more than 800,000 years.\n\nThe bubbles are the crucial part, because they hold actual ancient air rather than a proxy for it. Carbon dioxide and methane can be measured directly, and the isotopic composition of the ice itself indicates the temperature at which the snow formed.\n\nThe correlation between the two records is close, which is what makes the archive so consequential. Whether temperature drove gas concentration or the reverse cannot be settled from correlation alone, and the ordering has occupied researchers for decades.", [["Why are trapped bubbles particularly valuable?", "They are easy to count", "They indicate snowfall rates", "They preserve pollen", "They contain actual ancient air rather than a proxy", 3, "The passage stresses they hold actual ancient air, allowing direct measurement."], ["What does the isotopic composition of the ice indicate?", "The amount of dust present", "The temperature at which the snow formed", "The depth of the ice sheet", "The age of the layer", 1, "Isotopic composition indicates formation temperature."], ["What does the passage say correlation cannot establish?", "Whether bubbles leak", "That the records are accurate", "Which of temperature and gas concentration drove the other", "How far back the record reaches", 2, "The ordering cannot be settled from correlation alone."]]],
["The Metric of Musical Time", "Music", 3, "A metronome divides time into identical intervals, but performed music rarely follows one. Measurements of pianists playing the same phrase repeatedly show consistent departures from the printed values, and the departures are not random: notes at phrase endings are lengthened, and the lengthening scales with how important the ending is.\n\nListeners depend on these deviations. A recording quantised to exact mechanical timing is reliably described as lifeless, and listeners asked to locate phrase boundaries in such a version perform worse than with the unquantised original.\n\nThe deviations therefore carry structural information rather than merely decorating it. What notation records is a skeleton, and a performer supplies a layer of timing that tells the listener how the piece is organised.", [["What do measurements of repeated performances show?", "Metronomes improve performance", "Notation is usually inaccurate", "Departures from printed timing are consistent and patterned", "Pianists play inconsistently", 2, "The departures are described as consistent and not random."], ["Why do listeners struggle with quantised recordings?", "They are played too quickly", "The timing cues to phrase structure are removed", "The pitch is altered", "The recording quality is poor", 1, "Listeners locate phrase boundaries worse without the deviations."], ["The passage concludes that timing deviations", "are decorative flourishes", "should be eliminated", "carry structural information", "occur only in piano music", 2, "The final paragraph states they carry structural information rather than decorating it."]]],
["Salt and the State", "History", 3, "Salt preserves food, and before refrigeration a society without it could not store a harvest or provision an army. Because everyone needed it and it was produced in few places, it was unusually easy to tax.\n\nStates exploited this for millennia. China operated a salt monopoly from the seventh century BCE, and at times the revenue approached half the imperial budget. France's gabelle required households to buy a fixed quantity at a set price, with rates differing so sharply between provinces that smuggling across internal borders became a substantial occupation.\n\nThe economics of a salt tax explain its politics. A good that people must buy regardless of price yields steady revenue, and for the same reason takes a larger share of a poor household's income than a rich one's, which is why salt taxes recur so often in the history of revolt.", [["Why was salt easy to tax?", "It could not be stored", "It was cheap to produce", "Everyone needed it and it came from few places", "It was used only by the wealthy", 2, "Universal need plus concentrated production made it easy to tax."], ["What does the passage say about the gabelle?", "Rates differed so much between provinces that smuggling flourished", "It replaced the Chinese monopoly", "It was abolished quickly", "It applied equally across France", 0, "Sharply differing provincial rates made smuggling a substantial occupation."], ["Why do salt taxes often provoke revolt?", "They apply only to farmers", "They are difficult to collect", "They reduce the supply of food", "They take a larger share of poor households' income", 3, "A good bought regardless of price weighs more heavily on poor households."]]],
["Camouflage and Counter-Shading", "Zoology", 2, "An animal lit from above is bright on top and shadowed underneath, and that gradient betrays its shape even when its colour matches the background. Counter-shading cancels it: the animal is dark above and pale below, so illumination and pigmentation offset each other and the body reads as flat.\n\nThe pattern appears in fish, birds, mammals and even some caterpillars, and where a caterpillar habitually hangs upside down the shading is reversed to match. That reversal is strong evidence the pattern is functional rather than incidental.\n\nCounter-shading fails in flat light. Under an overcast sky, with no strong gradient to cancel, a counter-shaded animal is slightly conspicuous, which is one reason many species combine it with disruptive markings that break the outline by a different mechanism.", [["How does counter-shading conceal an animal?", "By making the animal appear larger", "By cancelling the light gradient that reveals shape", "By reflecting light away from the observer", "By matching the background colour exactly", 1, "Dark above and pale below offsets illumination so the body reads as flat."], ["Why is the reversed pattern in some caterpillars significant?", "It explains their diet", "It is caused by their habitat", "It proves caterpillars see colour", "It shows the pattern is functional", 3, "Reversal to match an upside-down posture is evidence of function rather than accident."], ["Under overcast skies, counter-shading", "becomes slightly conspicuous", "changes colour", "works better", "has no effect at all", 0, "With no strong gradient to cancel, the animal is slightly conspicuous."]]],
["Why Bridges Fall", "Physics", 4, "The Tacoma Narrows bridge collapsed in 1940, and the event is often explained as resonance, with the wind supposedly matching the bridge's natural frequency. That account is wrong, and the correct one is more interesting.\n\nResonance requires a periodic driving force at a fixed frequency. The wind that day was steady, not oscillating. What occurred was aeroelastic flutter: the deck's own twisting altered how air flowed around it, and the altered flow pushed the deck further in the direction it was already twisting. The motion supplied its own driving force, and the amplitude grew until the structure failed.\n\nThe distinction matters for design. A resonance problem is solved by shifting the natural frequency away from expected inputs. A flutter problem cannot be, because the structure generates the input, and must be addressed by changing the shape so the airflow no longer feeds the motion.", [["Why is the resonance explanation incorrect?", "The bridge was too long", "The bridge had no natural frequency", "Resonance cannot damage steel", "The wind was steady rather than oscillating", 3, "Resonance needs a periodic driving force; the wind that day was steady."], ["In aeroelastic flutter, the driving force comes from", "the earth's vibration", "the wind's own rhythm", "the structure's own motion altering the airflow", "traffic crossing the bridge", 2, "The deck's twisting altered the flow, which pushed it further in the same direction."], ["Why can a flutter problem not be solved by shifting the natural frequency?", "The bridge is too heavy", "Flutter occurs at all frequencies", "The frequency cannot be measured", "The structure generates the input itself", 3, "Because the structure supplies its own driving force, shifting frequency does not help."]]],
["The Spice Trade and Navigation", "History", 3, "Pepper, cloves and nutmeg were worth carrying across the world because they were light, durable and enormously marked up. Cloves and nutmeg grew on a handful of islands in eastern Indonesia, and every kilogram sold in Europe had passed through many hands, each adding a margin.\n\nThe prize was therefore not the spice but the route. A European power reaching the islands directly could buy at source and cut out the chain. This is what funded the voyages of the fifteenth and sixteenth centuries, and what made the resulting maps state secrets: a chart showing safe passage was worth more than a cargo.\n\nThe outcome was self-limiting. Once several powers held the route, the margin collapsed, and the trading companies built to exploit scarcity found themselves competing on volume instead.", [["Why were spices worth transporting so far?", "They preserved other foods", "They were used as currency", "They could not be grown elsewhere at all", "They were light, durable and heavily marked up", 3, "The passage lists these three properties as making long carriage worthwhile."], ["Why were navigational charts treated as state secrets?", "A chart showing safe passage was worth more than a cargo", "They revealed spice-growing methods", "They showed military positions", "They were expensive to produce", 0, "The passage states exactly this."], ["What happened once several powers held the route?", "The islands were abandoned", "The margin collapsed and competition shifted to volume", "Spices lost their preservative value", "Prices rose further", 1, "The outcome was self-limiting: margins collapsed and companies competed on volume."]]],
["Enzymes and Temperature", "Chemistry", 3, "An enzyme speeds a reaction by holding the reacting molecules in a particular arrangement, and that arrangement depends on the enzyme's folded shape. The dependence produces a characteristic curve when activity is plotted against temperature.\n\nWarming initially helps. Molecules move faster, collisions are more frequent, and reaction rate rises much as it would without an enzyme. Beyond an optimum the curve falls steeply, because the bonds maintaining the fold begin to break and the shape is lost. The enzyme does not become slow so much as cease to be an enzyme.\n\nThe optimum tracks the organism. Enzymes from bacteria living in hot springs retain their fold above eighty degrees, and enzymes from Antarctic fish work at temperatures where mammalian enzymes are nearly inert. The chemistry is the same; the stability of the fold differs.", [["Why does enzyme activity fall above the optimum?", "The enzyme's folded shape is lost", "The reaction reverses", "Substrate is used up", "Reacting molecules move too fast", 0, "Bonds maintaining the fold break and the shape is lost."], ["The passage says that beyond the optimum the enzyme", "becomes a substrate", "works more slowly but normally", "effectively stops being an enzyme", "changes which reaction it catalyses", 2, "It does not become slow so much as cease to be an enzyme."], ["What differs between hot-spring and Antarctic enzymes?", "The chemistry of the reaction", "The substrates they act on", "The stability of the folded shape", "The speed of molecular collision", 2, "The chemistry is the same; the stability of the fold differs."]]],
["Public Transport and Density", "Sociology", 3, "A transport system's viability depends less on technology than on how many people live within walking distance of it. A tram line through dense housing draws riders from every stop; the same line through detached suburbs draws few, because the walk to the stop is long and most trips begin somewhere the line does not serve.\n\nThe relationship runs both ways. Where transit exists first, development tends to cluster around stations, since land there becomes more valuable. Where roads come first, development spreads thinly, and thin development cannot afterwards support transit without subsidy.\n\nThis is why retrofitting is so difficult. The pattern of a city is set early and lasts for a century or more, and a transit line added to a low-density landscape is competing against a geometry that was fixed long before it arrived.", [["What primarily determines whether a transit line succeeds?", "The speed of the vehicles", "The cost of construction", "The frequency of service", "How many people live within walking distance", 3, "Viability depends on how many people live within walking distance."], ["According to the passage, where transit is built first", "development spreads thinly", "land values fall", "development clusters around stations", "roads become unnecessary", 2, "Land near stations becomes more valuable and development clusters."], ["Why is retrofitting transit difficult?", "Vehicles are unsuitable", "Residents oppose it", "Construction costs have risen", "The city's geometry was fixed long before", 3, "A line added to low-density land competes against a geometry fixed long before."]]],
["The Antibody Repertoire", "Medicine", 4, "The immune system must recognise pathogens it has never encountered, including ones that do not yet exist. It cannot carry a gene for every possible antibody, since the number required exceeds the number of genes in the genome by many orders of magnitude.\n\nThe solution is combinatorial. Antibody genes are stored as separate segments, and each developing B cell cuts and rejoins a selection of them at random, adding further variation at the junctions. A modest library of segments therefore generates an enormous number of distinct receptors.\n\nRandomness creates a hazard: some receptors will recognise the body's own tissue. Developing cells are therefore tested against self-molecules and those that bind strongly are eliminated or edited. The system generates diversity blindly and then removes what is dangerous, rather than designing what is useful.", [["Why can the genome not encode every antibody directly?", "The number needed vastly exceeds the number of genes", "Genes cannot encode proteins", "Antibodies are made from sugars", "Antibodies are too large", 0, "The required number exceeds the genome's gene count by many orders of magnitude."], ["How is diversity generated?", "By copying antibodies from other people", "By mutating after infection only", "By importing genes from pathogens", "By randomly cutting and rejoining gene segments", 3, "Each B cell rejoins a random selection of segments, with junctional variation."], ["The passage characterises the system as one that", "generates blindly and then removes the dangerous", "avoids randomness entirely", "cannot recognise new pathogens", "designs useful receptors deliberately", 0, "The final sentence states exactly this."]]],
["Loanwords and Prestige", "Linguistics", 4, "When two languages meet, words move, and the direction is rarely symmetrical. English absorbed thousands of French words after 1066, while French took comparatively few from English at the time. The asymmetry tracked power rather than any property of the languages.\n\nThe domains borrowed reveal the relationship. English kept its own words for the animals a farmer raised, cow, sheep, swine, and took French words for the meat served at table, beef, mutton, pork. Words for law, government and cuisine came in bulk; words for weather, family and the body largely did not.\n\nBorrowing therefore records who controlled which spheres of life. A vocabulary is in part a sedimentary deposit, and the layers can be read.", [["What determined the direction of borrowing after 1066?", "Grammatical similarity", "The relative power of the groups", "Ease of pronunciation", "Geographic distance", 1, "The passage says the asymmetry tracked power rather than any property of the languages."], ["What does the cow and beef contrast illustrate?", "English had no word for meat", "French words were shorter", "Farmers spoke French", "The borrowing divided along lines of who raised and who ate the animal", 3, "English kept farm words; French supplied words for meat at table."], ["The metaphor of a sedimentary deposit suggests that vocabulary", "erodes over time", "changes randomly", "is the same in all languages", "preserves layers of historical contact", 3, "The layers can be read, recording who controlled which spheres."]]],
["Measuring the Speed of Light", "Physics", 4, "Galileo tried to measure light's speed with lanterns on hilltops and concluded only that it was very fast. The first real figure came from astronomy rather than the laboratory.\n\nIn 1676 Ole Rømer was timing eclipses of Jupiter's moon Io. The intervals were not constant: they shortened as Earth approached Jupiter and lengthened as it receded. Rømer reasoned that the variation was not in Io's orbit but in the distance the light had to cross, and that the accumulated delay gave the time light needed to traverse the earth's orbit.\n\nHis figure was low, because the size of the earth's orbit was itself poorly known, but the method was sound and the conclusion decisive: light does not travel instantaneously. What had been a philosophical question became a measurement with an error bar.", [["Why did the intervals between eclipses vary?", "Jupiter's rotation slowed", "Io's orbit is irregular", "Telescopes were imprecise", "The distance light had to travel changed", 3, "Rømer attributed the variation to the changing distance light must cross."], ["Why was Rømer's numerical value inaccurate?", "His telescope was too small", "He mistimed the eclipses", "He used the wrong moon", "The size of the earth's orbit was poorly known", 3, "The passage attributes the low figure to poor knowledge of the orbit's size."], ["What does the final sentence emphasise?", "That Rømer was ignored", "That a philosophical question became a measurable one", "That Galileo was correct", "That astronomy is unreliable", 1, "It contrasts a philosophical question with a measurement with an error bar."]]],
["Soil Carbon", "Environmental science", 3, "Soil holds more carbon than the atmosphere and all vegetation combined, most of it as partly decomposed organic matter that microbes have not yet finished consuming. How long it stays depends on how easily microbes can reach it.\n\nPloughing shortens that stay. Breaking the soil exposes protected organic matter to air and to microbes, which respire it away as carbon dioxide. Land converted from grassland to tillage has typically lost a substantial share of its topsoil carbon within decades.\n\nSome of this is recoverable. Reduced tillage, cover crops that keep roots in the ground year-round, and returning residues rather than removing them all rebuild the stock slowly. The rate is the difficulty: losses occur in years and gains accumulate over decades, so the accounting is asymmetric even where the practices are adopted.", [["Where is most soil carbon held?", "In partly decomposed organic matter", "In dissolved minerals", "In living roots", "In soil water", 0, "Most is partly decomposed organic matter microbes have not finished consuming."], ["How does ploughing reduce soil carbon?", "It removes topsoil physically", "It kills all soil microbes", "It compacts the soil", "It exposes protected organic matter to air and microbes", 3, "Breaking the soil exposes organic matter, which microbes respire away."], ["What does the passage identify as the central difficulty?", "Losses happen in years while gains take decades", "Cover crops reduce yields", "Soil carbon cannot be measured", "The practices are unknown", 0, "The accounting is asymmetric in time."]]],
["The Rise of Coffeehouses", "Sociology", 3, "Coffeehouses spread through European cities in the seventeenth century and were quickly regarded as something more than places to drink. They admitted anyone who could pay, seated men of different ranks at the same table, and stocked newspapers, which were expensive for an individual but affordable for a house serving hundreds.\n\nThe consequences were institutional. Lloyd's of London began in a coffeehouse where shipping news was exchanged and underwriters gathered. Several scientific societies and more than one newspaper have similar origins. Authorities noticed too, and attempts to close coffeehouses on political grounds were made in both England and the Ottoman empire.\n\nWhat made them consequential was not the drink but the combination: a cheap shared subscription to information, and a room where strangers of unequal rank could argue about it.", [["What made newspapers viable in coffeehouses?", "They were given away free", "They were printed there", "A shared subscription served hundreds cheaply", "Customers wrote them", 2, "Newspapers were expensive individually but affordable for a house serving hundreds."], ["Lloyd's of London is mentioned as an example of", "an institution originating in a coffeehouse", "a failed business", "a newspaper publisher", "a government monopoly", 0, "It began in a coffeehouse where shipping news was exchanged."], ["According to the passage, coffeehouses mattered because of", "the stimulant effect of coffee", "their architectural design", "their low prices", "shared information plus mixed-rank conversation", 3, "The final sentence names exactly this combination."]]],
["Extremophiles", "Biology", 3, "Life occupies conditions once assumed lethal. Microbes grow in near-boiling hot springs, in brine several times saltier than seawater, in rock kilometres underground and in acid at a pH near zero. Collectively these organisms are called extremophiles, though the term is a statement about human expectations rather than about them: to a thermophile, our temperature is lethal cold.\n\nTheir biochemistry differs in specific ways. Proteins in heat-adapted species carry more of the interactions that hold a fold together, and their membranes contain lipids that stay coherent at temperatures where ordinary membranes would liquefy.\n\nThe practical consequence has been large. An enzyme from a hot-spring bacterium made it possible to copy DNA through repeated heating cycles without adding fresh enzyme each round, which is the basis of a technique now used in nearly every biology laboratory.", [["Why does the passage call the term extremophile a statement about human expectations?", "The organisms live in ordinary places", "Conditions we consider extreme are normal for them", "The organisms are not truly extreme", "The term was coined recently", 1, "To a thermophile, our temperature is lethal cold."], ["How do heat-adapted proteins differ?", "They contain no amino acids", "They carry more interactions holding the fold together", "They fold more slowly", "They are smaller", 1, "The passage states they carry more of the interactions that hold a fold together."], ["The practical consequence described concerns", "desalinating water", "producing antibiotics", "copying DNA through repeated heating cycles", "generating electricity", 2, "A hot-spring enzyme allowed DNA copying without adding fresh enzyme each cycle."]]],
["Why Auctions Take Different Forms", "Economics", 4, "An auction is a way of discovering a price when the seller does not know what buyers will pay. The rules chosen change the outcome, sometimes counterintuitively.\n\nIn a sealed-bid auction where the highest bidder pays their own bid, bidders shade downward, offering less than the item is worth to them so as to keep a margin. The seller receives a price reflecting that caution. If instead the winner pays the second-highest bid, shading no longer helps: bidding your true value cannot lose you money and may win the item cheaply. The rule change makes honesty the sensible strategy.\n\nWhich raises more revenue is not obvious, and under certain assumptions the two are equivalent. Where those assumptions fail, and they usually do, auction design becomes an empirical problem rather than a theoretical one.", [["Why do bidders shade downward in a first-price sealed-bid auction?", "To avoid winning", "To keep a margin between their bid and their true value", "They cannot estimate value", "The rules require it", 1, "Bidders offer less than their value so as to keep a margin."], ["Under second-price rules, bidding one's true value is sensible because it", "guarantees winning", "raises the seller's revenue", "conceals the bidder's identity", "cannot lose money and may win cheaply", 3, "The passage states this directly."], ["What does the passage conclude about auction design?", "All auction forms are identical", "Theory settles the question", "Second-price auctions always raise more", "It is an empirical problem where theoretical assumptions fail", 3, "Where the assumptions fail, design becomes empirical."]]],
["Restoring Paintings", "Art history", 4, "Cleaning a painting means removing later material without removing original material, and the boundary is often unclear. Varnish yellows with age and is normally treated as removable, but painters sometimes tinted their varnish deliberately, and a cleaner who removes it restores a brightness the artist never intended.\n\nThe Sistine Chapel cleaning of the 1980s made the problem public. The colours revealed were far more intense than the muted tones critics had spent decades interpreting, and some argued that a layer of deliberate shading had been stripped away with the soot. Technical analysis largely supported the restorers, but the disagreement was not resolved by evidence alone.\n\nMuseums now favour reversible treatments and detailed documentation, an approach that concedes the point: a restoration is an interpretation, and the next generation may read the same painting differently.", [["Why is removing varnish sometimes controversial?", "Varnish cannot be removed safely", "Some painters tinted varnish deliberately", "Varnish is applied by museums", "Varnish never yellows", 1, "Removing deliberately tinted varnish restores a brightness the artist never intended."], ["What did critics allege about the Sistine Chapel cleaning?", "The colours faded afterwards", "A layer of deliberate shading was removed with the soot", "The work was left unfinished", "The wrong chapel was cleaned", 1, "Some argued deliberate shading had been stripped away with the soot."], ["Why do museums now favour reversible treatments?", "Because they require less documentation", "Because a restoration is an interpretation that may be revised", "They are cheaper", "Because they are faster", 1, "The final sentence explains the approach concedes that restoration is interpretation."]]],
["The Nitrogen Problem", "Chemistry", 4, "Nitrogen makes up most of the atmosphere, yet plants cannot use it. The two atoms in a nitrogen molecule are joined by a triple bond so strong that breaking it requires either an enzyme evolved for the purpose or extreme industrial conditions.\n\nFor most of history, agriculture depended on the enzyme. Bacteria in the roots of legumes fix nitrogen into a usable form, which is why crop rotations that include beans or clover restore fertility.\n\nThe Haber-Bosch process, developed before the First World War, broke the bond industrially using high pressure, high temperature and a catalyst. It is estimated that a large share of the nitrogen in a living human body passed through this process, and that the population the earth now supports could not be fed without it. It also consumes on the order of one percent of world energy.", [["Why can plants not use atmospheric nitrogen directly?", "It is too dilute", "It is chemically toxic", "Its triple bond is extremely difficult to break", "It exists only at high altitude", 2, "The triple bond requires an enzyme or extreme industrial conditions to break."], ["Why do crop rotations include legumes?", "Bacteria in their roots fix nitrogen into a usable form", "They resist pests", "They grow in poor soil", "They require little water", 0, "Root bacteria fix nitrogen, restoring fertility."], ["Which statement about Haber-Bosch is supported by the passage?", "It is essential to feeding the current population", "It was developed after 1945", "It consumes almost no energy", "It has replaced biological fixation entirely", 0, "The passage says the population now supported could not be fed without it."]]],
["The Black Death and Wages", "History", 4, "The plague that reached Europe in 1347 killed perhaps a third of the population within five years. The demographic collapse had an economic consequence that contemporaries found scandalous: wages rose.\n\nThe mechanism was simple. Land was unchanged and labour was suddenly scarce, so a surviving worker could demand more, or leave for a landlord who offered it. English legislation attempted to freeze wages at pre-plague levels and to forbid workers from moving, which is evidence both that wages were rising and that the law could not stop them.\n\nThe longer consequence was structural. Labour scarcity encouraged landholders to substitute where they could, favouring pasture over labour-intensive tillage, and weakened the obligations that had bound tenants to particular estates.", [["Why did wages rise after the plague?", "New laws required higher pay", "Prices of goods collapsed", "Labour became scarce while land did not", "Landlords became more generous", 2, "Land was unchanged and labour suddenly scarce, so workers could demand more."], ["What does wage-freezing legislation indicate?", "That workers were content", "That wages were rising and law could not prevent it", "That wages were falling", "That the plague had ended", 1, "The passage says the law is evidence both that wages rose and that it failed."], ["What structural change does the passage describe?", "A shift towards pasture and weaker tenant obligations", "The abolition of landholding", "A return to subsistence farming", "Rapid population recovery", 0, "Landholders favoured pasture, and obligations binding tenants weakened."]]],
["Sound and the Concert Hall", "Physics", 3, "A hall's reverberation time is how long a sound takes to fade to inaudibility, and it determines what music suits the room. A long reverberation blends successive notes, which flatters choral music written for stone churches and blurs rapid passages. A short one keeps detail and can sound dry.\n\nWallace Sabine established the relationship early in the twentieth century while trying to fix an unusable lecture room. He found reverberation time rises with the volume of the hall and falls with the amount of absorbing material, and expressed it in a formula still used.\n\nThe difficulty is that an audience absorbs sound. A hall tuned when empty behaves differently when full, which is why modern halls use adjustable absorbing panels rather than a single fixed compromise.", [["What does a long reverberation time do to music?", "Reduces overall volume", "Sharpens rapid passages", "Blends successive notes and blurs rapid passages", "Eliminates echo", 2, "Long reverberation blends notes, flattering choral music and blurring fast passages."], ["According to Sabine's finding, reverberation time rises with", "the volume of the hall", "the height of the stage", "the loudness of the source", "the number of listeners", 0, "It rises with hall volume and falls with absorbing material."], ["Why do modern halls use adjustable panels?", "To increase seating", "To reduce building costs", "To improve lighting", "Because an audience absorbs sound, changing the acoustics", 3, "A hall tuned empty behaves differently when full."]]],
["Seed Dispersal", "Botany", 2, "A plant cannot move, so its seeds must. Falling straight down puts a seedling in its parent's shade and in competition with it, so most species invest in getting seed away.\n\nThe strategies divide by carrier. Wind-dispersed seeds are light and often winged or plumed, and travel furthest in open country. Water carries buoyant seeds along rivers and between islands. Animal dispersal splits again: some seeds hook onto fur, while others sit inside fruit that an animal eats, carries and deposits elsewhere, often with fertiliser.\n\nFleshy fruit is therefore a payment. The plant spends sugar it could have used for growth in order to buy transport, and the seeds are built to survive digestion. Where the animals that once performed this service are extinct, some trees now drop fruit that nothing carries away.", [["Why is falling straight down disadvantageous?", "Predators gather beneath", "The seedling competes with its parent in shade", "The soil is depleted there", "The seed cannot germinate", 1, "It puts the seedling in the parent's shade and in competition with it."], ["The passage describes fleshy fruit as", "a storage organ", "a by-product of flowering", "a payment for transport", "a defence against herbivores", 2, "The plant spends sugar to buy transport."], ["What happens where dispersing animals are extinct?", "Some trees drop fruit that nothing carries away", "Seeds become wind-dispersed", "Trees produce more fruit", "Fruit stops being produced", 0, "The final sentence states exactly this."]]],
["Standard Deviation and Risk", "Mathematics", 4, "Two investments with the same average return are not equally attractive if one swings wildly and the other does not, and standard deviation is the usual measure of that spread. It is convenient, and it has assumptions that are easy to forget.\n\nThe measure treats deviations above and below the mean identically. An investor generally does not: an unexpected gain and an unexpected loss of equal size are not equally significant. Measures that count only downward deviation exist for this reason.\n\nThe deeper assumption concerns shape. Standard deviation summarises a distribution well when that distribution is roughly bell-shaped, and financial returns are not: extreme moves occur far more often than a bell curve predicts. A number that describes the ordinary variation well can therefore say very little about the events that matter most.", [["What does standard deviation measure?", "The probability of loss", "Average return", "The length of an investment", "The spread of values around the mean", 3, "It is the usual measure of how widely values swing around the average."], ["Why do some analysts prefer downside measures?", "They apply to bonds only", "They are easier to calculate", "Gains and losses of equal size are not equally significant", "They ignore the mean", 2, "Standard deviation treats deviations above and below identically; investors do not."], ["What is the deeper problem the passage identifies?", "Standard deviation is too complex", "Averages are always misleading", "Returns are not bell-shaped, so extremes are underestimated", "Returns cannot be measured", 2, "Extreme moves occur far more often than a bell curve predicts."]]],
["The Domestication of the Horse", "Anthropology", 4, "Horses were hunted long before they were ridden, and separating the two in the archaeological record is difficult, since a hunted horse and a ridden one leave similar bones.\n\nThe evidence that convinced most researchers is indirect. Wear on horse teeth from a bit differs from wear produced by grazing, and such wear appears on steppe sites by roughly 3500 BCE. Changes in herd composition help too: a hunted population shows a spread of ages, while a managed one shows many young males culled and females kept.\n\nThe consequences were disproportionate. A rider covers in a day what a walker covers in three, which extends the reach of trade, of raiding and of language. Several proposals for the spread of the Indo-European languages give the horse a central role for exactly this reason.", [["Why is riding hard to detect archaeologically?", "Riding leaves no equipment", "Bones do not survive on the steppe", "Horses were rarely buried", "Hunted and ridden horses leave similar bones", 3, "The passage says a hunted horse and a ridden one leave similar bones."], ["What does bit wear on teeth indicate?", "That the horse was controlled with a bit rather than only grazing", "The season of death", "The horse's age", "The horse's diet", 0, "Bit wear differs from wear produced by grazing."], ["Why does the passage call the consequences disproportionate?", "Horses replaced cattle", "A rider's range transformed trade, raiding and language spread", "Riding required little skill", "Horses were expensive", 1, "A rider covers in a day what a walker covers in three, extending reach."]]],
["Why Some Materials Are Transparent", "Physics", 4, "Whether a material lets light through depends on whether its electrons can absorb the energy the light carries. Electrons occupy discrete levels, and a photon is absorbed only if its energy matches a gap between an occupied level and an empty one.\n\nIn glass the gaps are wide, larger than the energy of visible photons, so visible light passes without being absorbed and the material is transparent. Ultraviolet photons carry more energy, match the gap, and are absorbed, which is why ordinary glass blocks much ultraviolet while passing light.\n\nIn a metal the electrons are free and can absorb almost any energy, so light does not penetrate. Transparency is therefore not about density: glass is denser than many opaque materials, and what matters is the arrangement of energy levels rather than how tightly packed the atoms are.", [["A photon is absorbed only when", "its energy matches a gap between electron levels", "the material is warm", "it strikes an atom directly", "the material is dense", 0, "Absorption requires the photon's energy to match a gap between an occupied and empty level."], ["Why does glass block ultraviolet but pass visible light?", "Ultraviolet travels more slowly", "Ultraviolet is reflected", "Ultraviolet photons match the energy gap while visible photons do not", "Glass filters by wavelength mechanically", 2, "Ultraviolet carries more energy, matches the gap and is absorbed."], ["What does the passage conclude about density?", "Denser materials are always opaque", "Glass is unusually light", "Density does not determine transparency", "Metals are the least dense", 2, "Glass is denser than many opaque materials; arrangement of levels matters."]]],
["Guilds and Quality", "Economics", 3, "A medieval guild controlled who could practise a trade in a town, how long an apprenticeship lasted and often what could be charged. The usual modern reading is that guilds were cartels which restricted entry to keep prices high, and the evidence for that reading is substantial.\n\nA competing account emphasises information. A customer buying a barrel or a pair of boots could not judge quality before use, and a guild that inspected work and expelled members who cheated made the trade's reputation collective. Where quality is hard to observe, some such mechanism is usually present.\n\nBoth can be true at once, and probably were. An institution that raises quality by restricting entry produces a benefit and a cost from the same act, and which dominates is a question about a particular guild in a particular town rather than about guilds in general.", [["What is the usual modern reading of guilds?", "Charitable organisations", "Religious institutions", "Training schools only", "Cartels restricting entry to keep prices high", 3, "The passage names this as the usual reading, with substantial evidence."], ["The competing account emphasises that guilds", "reduced apprenticeship length", "abolished price controls", "solved a problem of unobservable quality", "opened trades to outsiders", 2, "Inspection and expulsion made the trade's reputation collective."], ["What does the author conclude?", "The cartel account is disproved", "Guilds had no economic effect", "Guilds were purely harmful", "Benefit and cost came from the same act, so each case differs", 3, "An institution raising quality by restricting entry produces both, case by case."]]],
["Whale Falls", "Oceanography", 3, "When a large whale dies and sinks, it delivers to the deep sea in one event as much carbon as would otherwise arrive over thousands of years. The seafloor beneath open ocean is normally food-poor, since almost everything edible is consumed before it sinks.\n\nA whale fall passes through stages. Scavengers strip the soft tissue within months. Enrichment-opportunist worms and crustaceans then work the sediment saturated with remains. Finally bacteria break down lipids in the bones, releasing sulphide, and a community grows that depends on that chemistry rather than on sunlight, resembling the communities at hydrothermal vents.\n\nThe final stage can last decades. Several species are known only from whale falls, which raises a question that cannot yet be answered: how such specialists disperse between carcasses scattered across an ocean.", [["Why is the deep seafloor normally food-poor?", "Most edible material is consumed before it sinks", "The temperature prevents feeding", "Sunlight cannot reach it", "Currents remove nutrients", 0, "Almost everything edible is consumed before reaching the bottom."], ["The final stage of a whale fall resembles", "a coral reef", "a coastal estuary", "a kelp forest", "a hydrothermal vent community", 3, "Bacteria release sulphide and a chemistry-dependent community grows, like vent communities."], ["What open question does the passage raise?", "How specialist species travel between scattered carcasses", "Why bones contain lipids", "How long scavengers live", "How whales die", 0, "The final sentence poses exactly this."]]],
["Realism and the Serial Novel", "Literature", 3, "Many nineteenth-century novels first appeared in monthly or weekly parts, and the format shaped the books. A writer publishing serially could not revise an early chapter after later ones appeared, so structure had to be planned or improvised in public.\n\nSerialisation also rewarded particular effects. Each instalment needed an ending that would sell the next, which encouraged suspense at regular intervals, and a large cast helped, since a subplot could carry an issue while the main action rested. Readers waited weeks between parts, so characters were reintroduced and traits restated more often than a single-sitting reader needs.\n\nDickens exploited the format deliberately, adjusting later instalments in response to sales and correspondence. What looks to a modern reader like repetition or melodrama is often the shape a monthly deadline pressed into the work.", [["Why could serial writers not revise early chapters?", "Printing was too expensive", "Those chapters were already published", "Readers objected", "Editors forbade it", 1, "An early chapter could not be revised after later ones appeared."], ["Why did serial novels favour a large cast?", "Characters were cheaper to write", "Readers preferred crowds", "It shortened each instalment", "A subplot could carry an instalment while the main action rested", 3, "The passage gives exactly this reason."], ["What does the author suggest about apparent repetition?", "It was added by publishers", "It reflects careless writing", "It was a stylistic fashion", "It results from readers waiting weeks between parts", 3, "Characters were reintroduced and traits restated because of the gaps between parts."]]],
["Vertical Farming", "Environmental science", 4, "Growing crops in stacked indoor trays under electric light promises produce grown near consumers, unaffected by weather, using a fraction of the water of field agriculture, and the water claim is well supported since indoor systems recirculate.\n\nThe energy claim is the difficulty. A field receives sunlight without charge. An indoor farm must supply the equivalent, and although LED efficiency has improved substantially, lighting remains the dominant operating cost. Where electricity is generated from fossil fuel, the carbon saved on transport can be exceeded by the carbon spent on light.\n\nThe economics therefore favour crops that are light, perishable and valuable relative to the energy they need: leafy greens and herbs rather than wheat or potatoes. Vertical farming is best understood as a niche that suits particular crops rather than a replacement for fields.", [["Which claim does the passage regard as well supported?", "Higher yields for all crops", "Lower energy use", "Independence from electricity", "Lower water use", 3, "Indoor systems recirculate, so the water claim is well supported."], ["When can vertical farming increase net carbon?", "When LEDs are efficient", "When crops are transported far", "When water is recirculated", "When electricity comes from fossil fuel", 3, "Carbon saved on transport can be exceeded by carbon spent on light."], ["Which crops suit the method economically?", "Wheat and potatoes", "Leafy greens and herbs", "Root vegetables", "Grains generally", 1, "Light, perishable, valuable crops relative to energy needed."]]],
["The Placebo of Expertise", "Psychology", 4, "People asked to judge a field they do not know rely on cues that correlate loosely with quality: confidence, fluency, credentials, the density of technical vocabulary. These cues are not worthless, but they are easy to produce without the underlying competence.\n\nStudies of forecasting show the problem clearly. In several domains, the accuracy of expert predictions is close to chance, while the confidence with which they are offered is high and largely unrelated to whether they prove correct. Confidence appears to track how coherent a story the forecaster has constructed rather than how well that story predicts.\n\nThe practical response is not to dismiss expertise, which is real where feedback is fast and frequent, as in weather forecasting or anaesthesia. It is to ask what feedback the expert receives, and how quickly.", [["What cues do non-experts rely on?", "Confidence, fluency and credentials", "Length of experience only", "Published results", "Peer review", 0, "The passage lists confidence, fluency, credentials and technical vocabulary."], ["What do forecasting studies show about confidence?", "It closely tracks accuracy", "It decreases with experience", "It cannot be measured", "It is high and largely unrelated to accuracy", 3, "Confidence is high and largely unrelated to whether predictions prove correct."], ["What does the passage recommend?", "Asking what feedback the expert receives and how quickly", "Trusting credentials", "Relying on consensus", "Ignoring all experts", 0, "Expertise is real where feedback is fast and frequent."]]],
["Mangroves and Coastlines", "Environmental science", 2, "Mangroves grow where few plants can, in salt water on unstable mud, and their tangled prop roots trap sediment that would otherwise wash away. Coastlines with mangrove fringes accumulate land; those stripped of them retreat.\n\nThe protective value is measurable. Wave energy reaching the shore behind a wide mangrove belt is a fraction of what reaches an open beach, and settlements behind intact mangrove suffered markedly less damage in several recorded storm surges than comparable settlements without.\n\nThe usual pressure is aquaculture. Converting mangrove to shrimp ponds is profitable for a few years until the ponds degrade, after which the land is neither pond nor forest. Replanting is possible but slow, and a replanted stand takes decades to provide the structural protection that the cleared one already did.", [["How do mangroves build coastline?", "They raise the water table", "By absorbing salt from the water", "Their prop roots trap sediment", "They shade the shore", 2, "Tangled prop roots trap sediment that would otherwise wash away."], ["What evidence supports the protective value?", "Settlements behind intact mangrove suffered less storm damage", "Computer models only", "Sea levels fell locally", "Fishery yields increased", 0, "Recorded storm surges caused markedly less damage behind intact mangrove."], ["What does the passage say about replanting?", "It restores protection immediately", "It is cheaper than conservation", "It is impossible in salt water", "It takes decades to provide equivalent protection", 3, "A replanted stand takes decades to provide the structural protection lost."]]],
["Counting and Number Words", "Linguistics", 4, "Not every language has words for arbitrarily large exact numbers. Some Amazonian languages have terms corresponding roughly to one, two and many, and speakers asked to match a set of objects perform accurately with small quantities and approximately with larger ones.\n\nThe finding has been read in two ways. On the strong reading, lacking the words prevents exact reasoning about large sets, which would make counting a cultural technology rather than a natural capacity. On the weaker reading, the words are absent because the practice is absent, and both would appear if a need for exact large quantities arose.\n\nThe experiments do not separate these. What they do establish is that exact enumeration of large sets is not automatic. Whether the words enable the ability or merely accompany it remains open.", [["What do speakers of such languages do with large sets?", "Use gestures instead", "Match them approximately rather than exactly", "Refuse to answer", "Match them exactly but slowly", 1, "They perform accurately with small quantities and approximately with larger ones."], ["The strong reading holds that", "the languages are less complex", "lacking the words prevents exact reasoning about large sets", "the experiments were flawed", "counting is a natural capacity", 1, "That is stated as the strong reading, making counting a cultural technology."], ["What does the passage say the experiments establish?", "That the weaker reading is correct", "That exact enumeration of large sets is not automatic", "That words cause the ability", "That the languages will change", 1, "The experiments establish this without separating the two readings."]]],
["The Baroque Church Facade", "Art history", 3, "A Baroque church front is designed to be seen from a particular place, usually the end of a narrow street, and it is built to work at that angle rather than in elevation. Columns project further as they approach the centre, pediments are broken and layered, and the whole surface advances and recedes so that raking sunlight produces strong shadow.\n\nThe effect depends on the light. Photographed flat at noon, such a facade can look busy and incoherent; seen late in the day from the intended approach, the projections separate into clear planes and the composition resolves.\n\nThis is why judging Baroque architecture from photographs misleads so consistently. The building was composed for a moving viewer under changing light, and a single frontal image removes both variables the architect was working with.", [["Why do Baroque facades advance and recede?", "To increase interior space", "So raking light produces strong shadow", "To reduce building costs", "To support the roof", 1, "The surface advances and recedes so raking sunlight produces strong shadow."], ["Why can photographs mislead?", "They are too small", "They distort colour", "They are taken from too far away", "They remove the movement and changing light the architect used", 3, "A single frontal image removes both variables the architect worked with."], ["The passage indicates the facade was designed to be seen", "only from inside", "from directly above", "in elevation drawings", "from a particular approach under particular light", 3, "It is built to work from the end of a narrow street at a particular angle."]]],
["Insulin and Blood Sugar", "Medicine", 3, "Blood glucose must stay within a narrow band: too little starves the brain, too much damages vessels and nerves over years. Two hormones from the pancreas hold it there, working in opposite directions.\n\nAfter a meal, rising glucose triggers insulin, which prompts muscle and fat cells to take glucose in and the liver to store it. Between meals, falling glucose triggers glucagon, which prompts the liver to release stored glucose back into the blood. The pair form a loop that corrects in both directions.\n\nDiabetes breaks the loop in two distinct ways. In one form the cells producing insulin are destroyed and little is made. In the other, insulin is produced but tissues respond to it poorly, so more is required for the same effect until production cannot keep pace. The blood measurement looks similar; the underlying failure is not.", [["What does insulin prompt cells to do?", "Release stored glucose", "Take glucose in and store it", "Produce glucagon", "Break down protein", 1, "Insulin prompts muscle and fat cells to take glucose in and the liver to store it."], ["How do the two hormones relate?", "Glucagon replaces insulin", "They correct glucose in opposite directions", "Both raise blood glucose", "They reinforce each other", 1, "They work in opposite directions, forming a loop correcting both ways."], ["What distinguishes the two forms of diabetes described?", "One is temporary", "One lacks insulin, the other responds poorly to it", "The blood measurement differs", "One affects only the liver", 1, "One destroys insulin-producing cells; in the other tissues respond poorly."]]],
["Why Traffic Jams Appear Without Cause", "Sociology", 3, "On a busy motorway a jam can form with no crash, no lane closure and no exit involved. Drivers slow to a crawl, then accelerate again, and nothing explains it.\n\nThe cause is the reaction chain. A driver brakes slightly, perhaps for nothing. The driver behind, needing a moment to react, brakes a little harder to restore the gap. Repeated back through the line, a small disturbance is amplified into a full stop, and the resulting wave travels backwards along the road while the cars move forwards.\n\nDensity determines whether this happens. Below a critical traffic density, disturbances die out. Above it, they grow. This is why a road can run smoothly at one level of traffic and collapse when a small number of additional vehicles join, and why metering vehicles onto a motorway can raise total throughput.", [["What amplifies a small disturbance?", "Sudden lane changes", "Poor road surface", "Each driver braking slightly harder than the one ahead", "Speed limits", 2, "Reaction delay means each driver brakes harder to restore the gap."], ["The resulting wave", "travels backwards along the road", "disappears immediately", "stays in one place", "travels forward with the cars", 0, "The wave travels backwards while the cars move forwards."], ["Why can metering vehicles onto a motorway help?", "It keeps density below the critical level where disturbances grow", "It removes the need for lanes", "It shortens journeys", "It reduces average speed", 0, "Below critical density disturbances die out; metering keeps density there."]]],
["The Chemistry of Bread", "Chemistry", 2, "Bread depends on two processes that happen at once. Yeast consumes sugars and releases carbon dioxide, which inflates the dough. Gluten, formed when two wheat proteins meet water and are worked, produces an elastic network that traps the gas rather than letting it escape.\n\nKneading develops that network by aligning and linking the proteins, which is why under-kneaded dough spreads rather than rises. Flour with more protein makes a stronger network, which suits bread, while low-protein flour makes a weaker one, which suits cake.\n\nBaking fixes the structure. Gas expands with heat and the loaf rises further, then the proteins set and the starch absorbs water and gelatinises, converting an elastic dough into a solid crumb. The crust browns by a separate reaction between sugars and amino acids that requires the dry surface heat the interior never reaches.", [["What does gluten contribute?", "Carbon dioxide", "Sweetness", "An elastic network that traps gas", "Colour in the crust", 2, "Gluten forms the elastic network that traps the gas."], ["Why does under-kneaded dough spread rather than rise?", "It lacks sugar", "It is too warm", "It contains too much yeast", "Its protein network is undeveloped", 3, "Kneading develops the network by aligning and linking proteins."], ["Why does only the crust brown?", "The crust contains more protein", "The interior cools faster", "The interior contains no sugar", "Browning needs dry surface heat the interior never reaches", 3, "The reaction requires dry surface heat the interior never reaches."]]],
["The Collapse of the Bronze Age", "History", 5, "Around 1200 BCE, over a period of perhaps fifty years, almost every major state in the eastern Mediterranean ceased to function. The Hittite empire in Anatolia disappeared. The Mycenaean palaces of Greece burned and were not rebuilt. Ugarit, a wealthy trading city on the Syrian coast, was destroyed so completely that the clay tablets recording its final days were baked hard by the fire that consumed the building holding them. Egypt survived, but as a diminished power that never regained its former reach. Writing systems fell out of use across the region, and in Greece literacy did not return for four centuries.\n\nThe traditional explanation named a single culprit. Egyptian inscriptions from the reign of Ramesses III describe a confederation of raiders arriving by ship, whom modern scholars call the Sea Peoples, and for much of the twentieth century these invaders were treated as the cause. The account had the appeal of simplicity, and the destruction layers found at many sites seemed to confirm it.\n\nCloser examination weakened it. The Sea Peoples appear in the record already migrating, with families and possessions aboard, which suggests they were themselves displaced rather than expansionist. An invasion also fails to explain why states hundreds of kilometres apart, with different enemies and different defences, failed within the same generation. And several sites show no destruction layer at all: they were simply abandoned.\n\nCurrent accounts emphasise interdependence. Bronze requires copper and tin, and tin came from sources far to the east, so a bronze-using state depended on a trade network it did not control. Palace economies were centralised, storing and redistributing grain, which made them efficient in good years and brittle in bad ones. Evidence from pollen cores and isotopes points to a prolonged drought across the region in exactly this period.\n\nThe likely sequence is therefore a cascade. Drought reduced harvests; reduced harvests undermined the palace redistribution on which populations depended; hungry populations moved, disrupting the trade routes that supplied tin; the interruption of tin degraded military capacity precisely when it was most needed; and states weakened in this way fell to pressures they would have survived in ordinary times. No single element on this list would have been sufficient. Each made the others worse.\n\nThe episode is now studied less as an ancient curiosity than as a case of systemic failure, in which a network of specialised, interdependent, efficient states proved less resilient than the simpler societies that outlasted them.", [["What is the main purpose of the passage?", "To compare Egyptian and Hittite military organisation", "To trace how the explanation of a collapse shifted from a single cause to a cascade", "To argue that the Sea Peoples were the sole cause of the collapse", "To describe the trade in copper and tin", 1, "The passage sets out the traditional single-cause account, weakens it, and presents the interdependence model."], ["Why does the passage mention the clay tablets at Ugarit?", "The fire that destroyed the city baked and so preserved them", "They were written after the collapse", "They list the city's tin suppliers", "They record the arrival of the Sea Peoples in detail", 0, "The passage notes the tablets were baked hard by the fire that consumed the building."], ["Which observation most directly undermines the invasion explanation?", "Some sites were abandoned rather than destroyed", "Egypt survived the period", "The Hittite empire was landlocked", "Writing systems fell out of use", 0, "Sites with no destruction layer, simply abandoned, are hard to attribute to invaders."], ["According to the passage, the Sea Peoples appear in the record as", "traders in tin and copper", "allies of the Egyptian state", "a well-organised professional army", "a population already on the move with families and possessions", 3, "This detail suggests they were displaced rather than expansionist."], ["Why did bronze-using states depend on trade they could not control?", "Copper was prohibitively expensive", "Bronze was produced only in Egypt", "Tin came from distant sources", "Bronze had to be imported finished", 2, "Bronze requires copper and tin, and tin came from sources far to the east."], ["The word brittle in the passage is closest in meaning to", "slow to change", "militarily weak", "efficient under pressure", "liable to fail suddenly", 3, "Centralised palace economies were efficient in good years but liable to sudden failure in bad ones."], ["What evidence supports the drought hypothesis?", "Pollen cores and isotope data", "The absence of writing", "Destruction layers at Ugarit", "Egyptian inscriptions", 0, "The passage cites pollen cores and isotopes pointing to prolonged drought."], ["According to the cascade account, the interruption of tin supply mattered because it", "ended long-distance travel", "raised the price of luxury goods", "prevented the building of palaces", "degraded military capacity at the worst moment", 3, "Loss of tin degraded military capacity precisely when it was most needed."], ["The passage suggests that no single factor was sufficient because", "only drought is documented", "the evidence is too fragmentary", "each factor made the others worse", "the states were too powerful", 2, "The passage states each element made the others worse and none alone would have sufficed."], ["What broader lesson does the final paragraph draw?", "Specialised interdependent systems can be less resilient than simpler ones", "Ancient states kept poor records", "Collapse is always caused by climate", "Simpler societies are always more advanced", 0, "The episode is studied as systemic failure, with simpler societies outlasting the specialised ones."]]],
["How the Eye Builds Colour", "Biology", 5, "Colour is not a property of light. Light has wavelength, and wavelength is continuous; colour is what a nervous system constructs from a very coarse sampling of that continuum. Understanding how the construction works explains a number of otherwise puzzling facts about vision.\n\nThe human retina contains three types of cone cell, each with a pigment absorbing most strongly at a different wavelength, conventionally called short, medium and long. The names matter more than the labels blue, green and red, because the sensitivity ranges overlap heavily. A single cone cannot report wavelength at all: it responds more strongly to some wavelengths than others, but a dim light at its best wavelength and a bright light at a worse one produce the same signal. Wavelength information exists only in the ratio between cones, which is why colour vision requires at least two types and why a person with only one is genuinely colour-blind rather than merely colour-poor.\n\nThe ratio explains metamerism, the phenomenon that makes colour reproduction possible at all. Two physically different mixtures of wavelengths that happen to produce the same three cone responses are indistinguishable. A television does not reproduce the spectrum of a lemon; it produces a mixture of three primaries that yields the same three ratios, and the eye cannot tell the difference. A device with different sensors, or an animal with four cone types, would not be fooled.\n\nProcessing after the cones complicates the picture further. Signals are recombined into opponent channels: one carrying red against green, another blue against yellow, a third light against dark. This is why there is no colour that looks reddish-green, though there is no physical reason such a mixture should be impossible. The opponent architecture also produces afterimages, since a channel driven hard in one direction rebounds when the stimulus is removed.\n\nContext then adjusts everything. The visual system estimates the illumination and discounts it, which is why a sheet of paper looks white under warm indoor light and under blue midday sky, though the wavelengths reaching the eye differ enormously. This is colour constancy, and it is usually invisible precisely because it works. It fails in unusual lighting, and when it fails observers can disagree sharply about the colour of the same object, as several widely circulated photographs have demonstrated.\n\nColour, then, is a construction with several stages, each of which discards information. The result is not a measurement of the world but a useful summary, optimised for telling objects apart rather than for reporting physics.", [["What is the central claim of the passage?", "Wavelength cannot be measured", "Colour is a physical property of light", "Colour is constructed by the nervous system from coarse sampling", "Human colour vision is more accurate than any device", 2, "The opening states colour is what a nervous system constructs from coarse sampling."], ["Why can a single cone not report wavelength?", "Its pigment changes with age", "Brightness and wavelength produce indistinguishable changes in its signal", "It is too small to be measured", "It responds to only one wavelength", 1, "A dim light at its best wavelength and a bright light at a worse one produce the same signal."], ["Metamerism refers to", "the rebound after a strong stimulus", "the overlap between cone sensitivities", "the loss of colour vision with age", "different wavelength mixtures producing identical cone responses", 3, "Two physically different mixtures producing the same cone responses are indistinguishable."], ["According to the passage, a television works because", "three primaries can produce the same cone ratios as a real spectrum", "screens emit only pure wavelengths", "it reproduces the full spectrum of objects", "the eye cannot detect brightness", 0, "It produces a mixture yielding the same three ratios rather than reproducing the spectrum."], ["Why is there no reddish-green?", "Red and green are carried on a single opponent channel", "It appears only in afterimages", "The cones cannot detect both", "Such wavelengths do not exist", 0, "The opponent architecture puts red against green on one channel."], ["Afterimages are explained in the passage by", "cone damage from bright light", "a channel rebounding after being driven hard", "the failure of colour constancy", "metamerism", 1, "A channel driven hard in one direction rebounds when the stimulus is removed."], ["Colour constancy allows a sheet of paper to", "reflect all wavelengths equally", "change colour with distance", "look white under very different illumination", "appear brighter than its surroundings", 2, "The system estimates illumination and discounts it, so paper looks white under warm and cool light."], ["Why does the passage say colour constancy is usually invisible?", "It affects only trained observers", "It only operates in daylight", "It is noticed only when it fails", "It is too slow to perceive", 2, "It is invisible precisely because it works, and disagreement arises when it fails."], ["An animal with four cone types would", "have no opponent channels", "see fewer colours", "lack colour constancy", "not be fooled by the same metamers", 3, "The passage states such an observer would not be fooled by a three-primary match."], ["The final paragraph characterises colour vision as", "identical across species", "a useful summary optimised for distinguishing objects", "an evolutionary accident", "a precise measurement of physics", 1, "The result is a useful summary, optimised for telling objects apart rather than reporting physics."]]],
["Why Economists Disagree About the Minimum Wage", "Economics", 5, "Few questions in applied economics have been studied as intensively as the effect of a minimum wage on employment, and few have produced such durable disagreement. The dispute is instructive, because it turns less on ideology than on what can be measured.\n\nThe textbook prediction is straightforward. In a competitive labour market, a price floor above the market wage means employers demand less labour than workers supply, and the excess appears as unemployment. This model is simple, internally consistent, and has been taught for a century.\n\nThe empirical record is less obliging. A study by David Card and Alan Krueger in the early 1990s compared fast-food employment in New Jersey, which raised its minimum wage, with neighbouring Pennsylvania, which did not. The two areas were similar in most respects, so the comparison approximated an experiment. Employment in New Jersey did not fall relative to Pennsylvania, and by some measures rose. The finding was contested immediately, and the argument over data collection methods lasted years.\n\nSeveral explanations for a null result have been offered. One is monopsony: where a few employers dominate local hiring, they can pay below the competitive wage, and a modest minimum can raise pay without reducing employment, because it moves the wage towards the competitive level rather than above it. A second is adjustment along other margins. An employer facing higher wages may reduce hours, cut training, raise prices, accept lower profit, or reduce turnover costs because better-paid workers leave less often. Employment headcount, the variable most often measured, is only one of these, and not necessarily the first to move.\n\nA third consideration is the size of the increase. Almost all economists agree that a sufficiently large minimum wage would reduce employment; almost none argue that a very small one would. The empirical studies mostly examine modest increases, which means they test a narrow part of the range, and results from that part cannot be extended to increases several times larger.\n\nThis is why the disagreement persists. The studies that find no effect and the studies that find one are often examining different increases, in different labour markets, over different time horizons, using different measures. A finding that a fifteen percent rise in one state had no measurable employment effect within two years is not evidence about a doubling nationwide over five. Practitioners who describe the question as settled, in either direction, are usually generalising beyond what any individual study can support.", [["What is the main purpose of the passage?", "To argue that minimum wages reduce employment", "To describe the Card and Krueger study in detail", "To explain why a heavily studied question remains contested", "To advocate a specific minimum wage level", 2, "The passage examines why disagreement is durable, turning on what can be measured."], ["The textbook prediction rests on the assumption that the labour market is", "competitive", "monopsonistic", "seasonal", "unregulated", 0, "The prediction applies to a competitive labour market with a price floor above the market wage."], ["Why was the New Jersey and Pennsylvania comparison valuable?", "It lasted several decades", "The two areas were similar, approximating an experiment", "It measured wages rather than employment", "It covered the whole country", 1, "Similarity between the areas made the comparison approximate an experiment."], ["Under monopsony, a modest minimum wage can raise pay without cutting employment because it", "reduces the supply of workers", "forces employers to compete", "increases consumer demand", "moves the wage towards the competitive level rather than above it", 3, "Monopsonists pay below the competitive wage, so a modest floor moves pay towards it."], ["Which of the following is NOT mentioned as an alternative margin of adjustment?", "Relocating the business abroad", "Reducing hours", "Cutting training", "Raising prices", 0, "Relocation is not among the listed responses: hours, training, prices, profit and turnover are."], ["Why does the passage note that headcount is only one margin?", "It is measured only annually", "It may not be the first variable employers adjust", "It is unaffected by wages", "It is the hardest to measure", 1, "Employment headcount is one of several margins and not necessarily the first to move."], ["What point does the passage make about the size of increases studied?", "Studies examine only very large increases", "Studies mostly examine modest increases, testing a narrow range", "Larger increases are easier to study", "Increase size does not affect results", 1, "Studies mostly examine modest increases, so results cannot be extended to much larger ones."], ["The passage suggests that reduced turnover costs could", "offset some of the cost of higher wages", "increase unemployment", "lower worker productivity", "eliminate the need for training", 0, "Better-paid workers leave less often, which is listed among employer adjustments."], ["What does the author say about those who call the question settled?", "They ignore the textbook model", "They generalise beyond what individual studies support", "They work only in monopsony markets", "They rely on the strongest studies", 1, "The final sentence states exactly this."], ["The passage implies that a study's result depends on all of the following EXCEPT", "the time horizon", "the labour market examined", "the political affiliation of the researcher", "the measure of employment used", 2, "The passage lists increases, markets, horizons and measures; it explicitly says the dispute is not about ideology."]]],
