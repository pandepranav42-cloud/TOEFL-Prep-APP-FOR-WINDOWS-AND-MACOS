["The Problem of Antibiotic Discovery", "Medicine", 5, "Between 1940 and 1962, pharmaceutical researchers introduced more than twenty structurally distinct classes of antibiotic. Between 1962 and 2000 they introduced none. The gap is not explained by loss of interest, since resistance was recognised as a growing threat throughout, nor by a shortage of funding in the early part of that period. It is explained by the exhaustion of a method.\n\nThe productive era relied on soil screening. Selman Waksman's laboratory cultured soil microorganisms, tested their secretions against bacteria, and isolated the compounds responsible. Soil is crowded and competitive, so its inhabitants have evolved chemical weapons against one another, and a great many of those weapons work on human pathogens too. Streptomycin, tetracycline, chloramphenicol and the early macrolides all emerged this way within about fifteen years.\n\nThe method then began returning what it had already found. Screening soil samples produced known compounds again and again, at rising cost per novel discovery, because the abundant and easily cultured organisms had already been examined. This is a rediscovery problem rather than an absence of candidates: it is now estimated that fewer than one percent of soil bacteria grow under standard laboratory conditions, so the great majority had never been screened at all, not because they lacked useful chemistry but because nobody could grow them.\n\nThe economics then made the problem worse. A new antibiotic is used briefly, in small quantities, and ideally reserved for cases where existing drugs have failed, which is the opposite of a commercially attractive product. A drug for a chronic condition is taken daily for decades. Several large firms closed their antibiotic divisions entirely, not because the science was impossible but because success would produce a medicine that responsible practice requires be used as little as possible.\n\nRecent work has attacked the cultivation barrier directly. One approach grows bacteria inside diffusion chambers buried in their native soil, so the organism receives the chemical signals it needs from its own environment while remaining isolated enough to study. Teixobactin was identified this way. Another sequences DNA extracted from soil without culturing anything, identifying gene clusters that look capable of producing antibiotics and then expressing those clusters in a host organism that does grow in a laboratory.\n\nBoth approaches address the discovery bottleneck. Neither addresses the economic one, which is why proposals now focus on changing how antibiotics are paid for, for example by rewarding a developer for having a drug available rather than for the volume sold. The technical and commercial problems are separable, and solving only one would leave the situation much as it is.", [["What explains the gap in antibiotic discovery after 1962?", "The elimination of bacterial disease", "The exhaustion of the soil screening method", "A complete lack of funding", "A loss of scientific interest", 1, "The passage explicitly attributes the gap to the exhaustion of a method."], ["Why is soil a productive source of antibiotics?", "It contains few competing organisms", "It is easy to sterilise", "Its inhabitants evolved chemical weapons against one another", "It preserves compounds for long periods", 2, "Soil is crowded and competitive, so organisms evolved chemical weapons."], ["The rediscovery problem refers to", "laboratories repeating each other's work", "patients redeveloping infections", "screening returning compounds already known", "bacteria regaining resistance", 2, "Screening produced known compounds repeatedly at rising cost per novel find."], ["What proportion of soil bacteria grow under standard laboratory conditions?", "Fewer than one percent", "Nearly all of them", "About half", "Roughly a quarter", 0, "The passage gives fewer than one percent."], ["The passage argues that unscreened bacteria were overlooked because", "nobody could grow them", "they were found only in rare locations", "they lacked useful chemistry", "they were too dangerous to handle", 0, "The majority had never been screened because they could not be cultured, not for lack of chemistry."], ["Why are antibiotics commercially unattractive?", "They are used briefly and ideally reserved for failures of other drugs", "They require refrigeration", "They are expensive to manufacture", "They cannot be patented", 0, "Brief, small-volume, reserved use is the opposite of a commercially attractive product."], ["The diffusion chamber approach works by", "sterilising soil before sampling", "increasing the temperature of cultures", "letting an organism receive native chemical signals while staying isolated", "removing competing bacteria", 2, "Chambers buried in native soil supply the needed signals while isolating the organism."], ["The DNA-based approach avoids cultivation by", "using synthetic soil", "growing bacteria more slowly", "screening only known species", "expressing promising gene clusters in a host that does grow", 3, "Gene clusters are identified from extracted DNA and expressed in a culturable host."], ["What does the passage identify as the remaining obstacle?", "The technical difficulty of cultivation", "The economic structure of antibiotic development", "Public resistance to new drugs", "The speed of bacterial evolution", 1, "Neither new approach addresses the economic problem."], ["The proposal to reward availability rather than volume is intended to", "increase antibiotic prescriptions", "reduce research spending", "speed up clinical trials", "align payment with responsible restricted use", 3, "Paying for availability suits a drug that should be used as little as possible."]]],
["Memory, Testimony and the Law", "Psychology", 5, "Courts have historically treated a confident eyewitness as strong evidence, and juries respond to confidence more than to any other feature of testimony. Research on memory has made this practice difficult to defend in its traditional form, though the findings are more specific than the popular summary that memory is simply unreliable.\n\nThe central finding is that remembering is reconstructive. A memory is not retrieved intact from storage but assembled at the moment of recall from partial traces, general knowledge and expectation. The assembly is usually accurate enough, which is why the process goes unnoticed. But because it happens fresh each time, information encountered after the event can be incorporated into the reconstruction without the person detecting any change.\n\nElizabeth Loftus demonstrated this repeatedly. Participants shown a filmed collision were asked how fast the cars were going when they hit each other, or when they smashed into each other. The verb altered the speed estimates, and participants asked the smashed version were later more likely to report having seen broken glass in a film that contained none. The misinformation was not detected as foreign; it had become part of the memory.\n\nConfidence behaves worse than intuition suggests. It is only weakly related to accuracy in most conditions, and, more troublingly, it inflates with repetition and feedback. A witness who identifies a suspect tentatively, is told the identification matches other evidence, and then repeats the account several times before trial will arrive in court far more confident than at the moment of identification, with no corresponding gain in accuracy. The jury sees only the final confident version.\n\nThe practical responses target procedure rather than the witness. A lineup administered by an officer who does not know which person is the suspect cannot leak that knowledge through hesitation or emphasis. Presenting members sequentially rather than side by side discourages the relative judgement of picking whoever resembles the memory most, which is the error a lineup invites. Recording confidence immediately at the identification, before any feedback, preserves the one measurement that carries information. Each of these has been shown to reduce mistaken identifications without much reducing correct ones.\n\nThe conclusion the research supports is narrower than blanket scepticism. Eyewitness memory is not worthless; it is a measurement that degrades in specific, predictable ways under specific, avoidable conditions. Treating it as either infallible or useless both miss the point, which is that the procedure surrounding the witness determines how much the testimony is worth.", [["What is the main argument of the passage?", "Eyewitness testimony should be excluded from trials", "Juries are incapable of assessing evidence", "Memory is reconstructive, so procedure determines testimony's value", "Confidence is a reliable guide to accuracy", 2, "The passage argues memory is reconstructive and procedures determine reliability."], ["Reconstructive memory means that a memory is", "held only briefly", "erased after each recall", "stored intact and retrieved unchanged", "assembled at recall from traces, knowledge and expectation", 3, "The passage defines it as assembled at the moment of recall."], ["Why is post-event information dangerous?", "It is usually deliberate deception", "It causes the witness to forget entirely", "It replaces the original memory instantly", "It can be incorporated without the person detecting a change", 3, "Because assembly happens fresh each time, later information is incorporated undetected."], ["In the Loftus experiment, changing the verb altered", "the length of the film", "the participants' eyesight", "the number of participants", "speed estimates and later reports of broken glass", 3, "The verb altered speed estimates and later reports of glass that was not present."], ["According to the passage, confidence inflates with", "the passage of time alone", "the seriousness of the crime", "the witness's age", "repetition and feedback", 3, "Confidence inflates with repetition and feedback, without gain in accuracy."], ["Why is a lineup administered by an uninformed officer preferable?", "It requires fewer participants", "The officer cannot leak which person is the suspect", "It allows more suspects to be shown", "It is faster to conduct", 1, "An administrator who does not know cannot leak it through hesitation or emphasis."], ["Sequential presentation is intended to discourage", "identification of any suspect", "relative judgement between lineup members", "the use of photographs", "recording of confidence", 1, "It discourages picking whoever resembles the memory most, a relative judgement."], ["Why should confidence be recorded immediately?", "It speeds up the trial", "Witnesses forget their confidence level", "Courts require written records", "Before feedback, it is the one measurement carrying information", 3, "Recorded before feedback, initial confidence preserves informative signal."], ["What does the passage say about the reforms' effects?", "They reduce correct identifications substantially", "They reduce mistaken identifications without much cost to correct ones", "They have not been tested", "They apply only to serious crimes", 1, "Each has been shown to reduce mistaken identifications without much reducing correct ones."], ["The final paragraph rejects which two positions?", "That memory is reconstructive and that it is stored", "That lineups help and that they harm", "That testimony is infallible and that it is useless", "That juries are fair and that they are biased", 2, "Treating testimony as either infallible or useless both miss the point."]]],
["Glaciers as Recorders and as Hazards", "Environmental science", 5, "A glacier is a river of ice that flows under its own weight, and like a river it both records the conditions it passes through and reshapes the land it moves across. Both roles have become urgent as glaciers retreat.\n\nThe recording function depends on how ice forms. Snow that survives the summer is buried by the following winter's fall, and under the accumulating weight it compacts, expelling air until the remaining gas is sealed into bubbles. Those bubbles hold samples of the atmosphere at the moment the ice closed. Layers are annual where snowfall is seasonal, so a core can be counted like tree rings for the upper section and dated by flow modelling and chemical markers deeper down. Volcanic eruptions leave sulphate spikes that appear in cores from both poles, providing fixed points that allow separate records to be aligned.\n\nGlacier mass balance is the difference between accumulation at the top and melting and calving at the bottom. A glacier in balance advances in cold decades and retreats in warm ones without changing much overall. The current situation differs: the great majority of monitored glaciers are losing mass persistently rather than fluctuating, and the loss has accelerated over recent decades.\n\nThe consequences are not only distant. Roughly a quarter of the world's population lives in catchments where glacier melt contributes meaningfully to dry-season river flow. A glacier acts as a buffer, storing precipitation as ice in wet years and releasing it in dry ones, which smooths the water supply. As glaciers shrink, that buffering weakens. The counterintuitive part is that flow initially increases, since a retreating glacier releases more water than it stores, and only later declines sharply once the ice available to melt is largely gone. Communities can therefore experience abundance shortly before scarcity.\n\nRetreat also creates a direct hazard. Meltwater collects behind the loose rock ridges a glacier deposited at its former limit, forming lakes held back by unconsolidated debris rather than bedrock. Such dams fail without warning, sometimes when a mass of ice or rock falls into the lake and displaces water over the barrier. The resulting flood can travel far down valley at destructive speed. Several thousand such lakes are now catalogued in the Himalaya and the Andes, and the number is increasing as ice retreats and exposes new basins.\n\nA glacier is therefore both an archive and a piece of infrastructure. The archive is being read with increasing precision at the same time that the infrastructure is failing, and the second process is erasing the first.", [["What is the main idea of the passage?", "Ice cores are the only source of climate data", "Glacial lakes are the greatest natural hazard", "Glaciers serve as both climate archives and water infrastructure, and both are threatened", "Glaciers are primarily a scientific curiosity", 2, "The final paragraph frames the glacier as both archive and infrastructure, both under threat."], ["How do bubbles in ice preserve atmospheric samples?", "Compaction expels air until the remainder is sealed in", "Snow absorbs gases chemically", "Meltwater traps gas as it refreezes", "Gas diffuses into ice over time", 0, "Accumulating weight compacts snow, expelling air until remaining gas is sealed into bubbles."], ["Why are volcanic sulphate spikes useful?", "They date the eruption precisely", "They indicate local temperature", "They show the depth of snowfall", "They provide fixed points for aligning separate records", 3, "Spikes appear in cores from both poles, allowing separate records to be aligned."], ["Mass balance is the difference between", "snowfall and rainfall", "ice thickness and glacier length", "accumulation and loss through melting and calving", "summer and winter temperature", 2, "The passage defines it as accumulation at the top minus melting and calving at the bottom."], ["What distinguishes the current situation from normal fluctuation?", "Most monitored glaciers lose mass persistently rather than fluctuating", "Accumulation has stopped entirely", "Calving has ceased", "Glaciers are advancing everywhere", 0, "The great majority are losing mass persistently, and the loss has accelerated."], ["How does a glacier buffer water supply?", "By increasing rainfall locally", "By preventing evaporation", "By storing precipitation as ice and releasing it in dry years", "By blocking rivers in wet years", 2, "It stores precipitation as ice in wet years and releases it in dry ones."], ["Why can river flow increase before it declines?", "New tributaries form", "A retreating glacier releases more water than it stores", "Melting slows in summer", "Rainfall rises with temperature", 1, "Retreat releases more than is stored, so flow rises before falling sharply."], ["Glacial lake dams are dangerous because they consist of", "solid bedrock", "compacted glacier ice only", "artificial concrete barriers", "unconsolidated debris left at a former ice limit", 3, "Lakes are held back by loose rock ridges rather than bedrock."], ["What can trigger a sudden dam failure?", "A gradual rise in temperature", "Ice or rock falling into the lake and displacing water", "A reduction in meltwater", "Seasonal rainfall", 1, "The passage names a mass of ice or rock displacing water over the barrier."], ["The final sentence means that", "the loss of glaciers destroys the record they contain", "infrastructure is more important than research", "reading the archive causes the ice to melt", "the archive is already complete", 0, "The process of failure is erasing the archive being read."]]],
["The Invention of Double-Entry Bookkeeping", "Economics", 5, "A merchant in medieval Europe kept records the way most people keep a diary: transactions listed as they occurred, with no structure imposing consistency. Such a list tells you what happened but not whether the account of it is complete, and errors are invisible because nothing contradicts them.\n\nDouble-entry bookkeeping, described systematically by Luca Pacioli in 1494 though already in use among Italian merchants for two centuries, imposes a structure that makes certain errors impossible to hide. Every transaction is recorded twice, once as a debit and once as a credit, in different accounts. A sale reduces inventory and increases cash; a loan increases cash and increases liabilities. Because the two sides must always sum to the same figure, a discrepancy signals that something has been recorded wrongly or not at all.\n\nThe innovation is best understood as error detection rather than record keeping. The system does not prevent fraud, since a determined bookkeeper can falsify both sides. It does prevent the ordinary mistakes that accumulate silently in a single list, and it does so automatically, without anyone having to remember to check.\n\nA second consequence was conceptual. Because assets, liabilities and capital are tracked separately, the accounts distinguish what a business owns from what it owes and from what its owners have contributed. That distinction makes it possible to speak of a firm's financial position at a moment in time, independent of its owner's personal wealth, and therefore to speak of the firm as an entity in its own right.\n\nThis mattered for what came later. Investors who are not managers need a way to assess a business they cannot observe directly, and a system producing a statement of position and a statement of performance provides one. Werner Sombart argued that capitalism could not have developed without it, which is probably too strong, since the causal arrow is hard to establish and other societies conducted large-scale commerce without the technique. The weaker claim is easier to defend: the joint-stock company, in which many strangers own a share of an enterprise none of them runs, is difficult to imagine without a method of accounting that makes an enterprise legible to someone outside it.\n\nWhat began as a way of catching arithmetic slips became the vocabulary in which economic activity is described.", [["What is the main point of the passage?", "Double-entry bookkeeping was invented by Pacioli", "A technique for catching errors reshaped how business is understood", "Medieval merchants kept poor records", "Fraud is impossible under double-entry", 1, "The passage traces the technique from error detection to making firms legible to outsiders."], ["Why are errors invisible in a simple list of transactions?", "Nothing in the record contradicts a mistake", "The list is too long to check", "Merchants wrote illegibly", "Entries were made from memory", 0, "A single list tells what happened but nothing contradicts an error."], ["How does double-entry reveal a mistake?", "An auditor reviews each entry", "Errors are highlighted in the margin", "Transactions are numbered sequentially", "The two sides fail to sum to the same figure", 3, "Because both sides must sum equally, a discrepancy signals an error."], ["The passage says the system does NOT", "track liabilities", "operate automatically", "detect ordinary mistakes", "prevent deliberate fraud", 3, "A determined bookkeeper can falsify both sides."], ["Pacioli's role was to", "describe systematically a method already in use", "found the first joint-stock company", "invent the technique", "translate Italian records", 0, "He described it in 1494 though merchants had used it for two centuries."], ["What conceptual consequence does the passage identify?", "Interest rates could be computed", "A firm could be treated as an entity separate from its owner", "Taxes became easier to collect", "Merchants could calculate faster", 1, "Separating assets, liabilities and capital allows the firm to be seen in its own right."], ["Why do investors who are not managers need such a system?", "To assess a business they cannot observe directly", "To calculate their own taxes", "To replace the managers", "To value competing currencies", 0, "The passage states this need explicitly."], ["The author regards Sombart's claim as", "probably too strong", "irrelevant to accounting", "deliberately misleading", "clearly correct", 0, "The passage calls it probably too strong, since causation is hard to establish."], ["Which evidence is offered against Sombart's strong claim?", "Other societies conducted large-scale commerce without the technique", "Joint-stock companies predate 1494", "Accounting was rarely taught", "Pacioli published late", 0, "The passage cites other societies trading at scale without it."], ["The final sentence suggests that bookkeeping", "failed to spread beyond Italy", "remains a minor clerical task", "was replaced by modern software", "became the language for describing economic activity", 3, "What began as error-catching became the vocabulary of economic description."]]],
["How Vaccines Are Tested", "Medicine", 5, "A vaccine trial is designed around a problem: most people who receive a vaccine would not have caught the disease anyway. Simply observing that vaccinated people stayed healthy proves nothing, because unvaccinated people would mostly have stayed healthy too. The trial must therefore be built so that the comparison carries information.\n\nRandomisation does the essential work. Participants are assigned to vaccine or placebo by chance rather than by choice, which means the two groups should differ only in what they received. Without it, the healthier, wealthier or more cautious tend to volunteer for the active arm, and any later difference in outcomes could reflect who they were rather than what they were given.\n\nBlinding addresses a second problem. If participants know which arm they are in, those who believe themselves protected may behave less carefully, and those who know they received a placebo may report symptoms differently. If the doctors assessing outcomes know, their judgement of ambiguous cases can drift. Double blinding, in which neither party knows, removes both channels.\n\nThe trial then waits. Efficacy is measured by comparing how many cases occur in each arm, so the trial ends not after a fixed period but once enough cases have accumulated to distinguish a real difference from chance. This is why trials run during an outbreak conclude faster than trials run when transmission is low: the necessary events arrive sooner. It also explains why a trial can be large and still inconclusive if the disease is rare.\n\nPhases separate different questions. Phase one, in a few dozen people, asks primarily whether the vaccine is safe and what dose produces an immune response. Phase two, in hundreds, refines dosing and examines immune response in a wider range of people. Phase three, in thousands or tens of thousands, is where efficacy against actual disease is measured, and where uncommon side effects may first appear. Rare effects, occurring perhaps once in a hundred thousand doses, will not appear even in phase three, which is why surveillance continues after approval.\n\nEach element addresses a specific way the answer could be wrong. Randomisation controls who is compared, blinding controls how outcomes are judged, case accumulation controls whether the difference is real, and post-approval surveillance covers what the trial was too small to see. A trial missing any one of them is not simply less rigorous; it is vulnerable to a particular error the others cannot catch.", [["What is the central problem a vaccine trial must solve?", "Vaccines are expensive to produce", "Participants dislike injections", "Most vaccinated people would not have caught the disease anyway", "Diseases mutate during trials", 2, "The opening states this problem directly."], ["Randomisation ensures that the two groups", "contain only healthy people", "receive the same treatment", "are the same size exactly", "differ only in what they received", 3, "Assignment by chance means groups should differ only in what they were given."], ["Without randomisation, who tends to volunteer for the active arm?", "Medical professionals only", "The oldest participants", "The healthier, wealthier or more cautious", "Those already infected", 2, "The passage names exactly these groups."], ["Blinding the assessing doctors prevents", "errors in dosing", "the vaccine from spoiling", "judgement of ambiguous cases from drifting", "participants from withdrawing", 2, "If assessors know the arm, their judgement of ambiguous cases can drift."], ["A trial ends when", "enough cases have accumulated", "a fixed period has elapsed", "all participants are vaccinated", "funding runs out", 0, "Efficacy needs enough cases to distinguish a real difference from chance."], ["Why do trials during an outbreak conclude faster?", "Fewer participants are needed", "Participants are easier to recruit", "The necessary cases arrive sooner", "Regulators relax the requirements", 2, "The events the trial waits for accumulate more quickly."], ["A large trial can still be inconclusive if", "the disease is rare", "participants are randomised", "the vaccine is very effective", "blinding is used", 0, "With few cases, the comparison cannot distinguish a real difference."], ["Phase one is primarily concerned with", "rare side effects", "cost of manufacture", "safety and dose-finding", "efficacy against disease", 2, "Phase one asks whether the vaccine is safe and what dose produces a response."], ["Why does surveillance continue after approval?", "Manufacturing changes after approval", "Trials cannot measure immune response", "Very rare effects will not appear even in phase three", "Regulators require annual testing", 2, "Effects occurring once in a hundred thousand doses are invisible at trial scale."], ["The final paragraph argues that each element", "addresses a specific error the others cannot catch", "increases the cost unnecessarily", "was added for regulatory reasons", "is optional depending on the disease", 0, "A trial missing one is vulnerable to a particular error the others cannot catch."]]],
["Why Rivers Meander", "Geology", 5, "A river crossing a flat plain does not run straight, and the reason is not that something is in the way. Meandering is what a flowing channel does when it is free to shape its own bed, and it appears in settings where obstacles play no part at all, including channels cut by meltwater on the surface of a glacier and by ocean currents on the deep sea floor.\n\nThe mechanism is self-reinforcing. Any slight bend causes water to travel faster on the outside of the curve and slower on the inside, because the outer path is longer. Faster water carries more sediment, so it erodes the outer bank; slower water drops sediment, so material accumulates on the inner bank. The bend therefore deepens itself. What began as a negligible deflection becomes a pronounced curve, and the curve migrates across the plain as erosion and deposition continue on opposite banks.\n\nA second circulation makes the process more efficient than a simple account suggests. Water at a bend does not merely move faster on the outside; it also spirals, flowing across the bed from the outer bank towards the inner one while surface water moves the other way. This helical flow carries eroded material directly from the cutting bank to the depositing one, which is why the inner bank of a meander is typically a smooth bar of sediment of exactly the kind being removed opposite.\n\nMeanders do not grow indefinitely. As a bend becomes more pronounced, its neck narrows, and eventually the river cuts across the neck during a flood, abandoning the loop. The severed curve remains as an oxbow lake, which silts up over time and leaves a curved scar visible in the landscape long after the water has gone. Aerial photographs of flood plains show dozens of such scars, recording positions the river occupied and left.\n\nThe regularity is striking. Across an enormous range of scales, from streams a metre wide to rivers a kilometre across, the wavelength of a meander is roughly ten to fourteen times the channel width. That a proportion should hold across four orders of magnitude suggests the pattern is governed by the physics of flow rather than by local conditions of soil or slope, and it is one reason meandering is treated as a general property of moving fluid rather than a peculiarity of any particular river.", [["What is the main idea of the passage?", "Meanders occur only in soft soil", "Oxbow lakes are the primary feature of flood plains", "Rivers meander because obstacles deflect them", "Meandering is a self-reinforcing property of free-flowing channels", 3, "The passage argues meandering arises from flow itself, not obstruction."], ["Why does the passage mention channels on glaciers and the sea floor?", "To show meanders occur without obstacles", "To describe unusual sediments", "To compare erosion rates", "To date the formation of rivers", 0, "These settings have no obstacles, supporting the claim that meandering is intrinsic."], ["Water moves faster on the outside of a bend because", "the outer path is longer", "sediment is finer there", "the bank is steeper there", "the water is deeper", 0, "The passage attributes the speed difference to path length."], ["Erosion and deposition at a bend cause it to", "split into two channels", "straighten over time", "deepen and migrate", "become shallower", 2, "Erosion outside and deposition inside deepen the bend and move it across the plain."], ["Helical flow carries sediment", "out of the channel entirely", "downstream only", "from the outer bank to the inner bank", "upward to the surface", 2, "Water spirals across the bed from the cutting bank to the depositing one."], ["The smooth bar on the inner bank consists of", "material eroded from the opposite bank", "imported glacial debris", "bedrock exposed by erosion", "organic matter", 0, "It is sediment of exactly the kind being removed opposite."], ["An oxbow lake forms when", "sediment blocks the channel", "the river dries up", "two rivers converge", "the river cuts across a narrowed neck during a flood", 3, "The river cuts the neck during a flood and abandons the loop."], ["Curved scars on a flood plain record", "glacial movement", "former positions of the river", "agricultural boundaries", "ancient coastlines", 1, "They record positions the river occupied and left."], ["The wavelength of a meander is roughly", "ten to fourteen times the channel width", "a hundred times the channel width", "equal to the channel width", "unrelated to channel width", 0, "The passage gives this proportion."], ["Why is the constant proportion across scales significant?", "It suggests the pattern is governed by flow physics", "It shows soil type determines meandering", "It proves rivers are the same age", "It contradicts the helical flow model", 0, "Holding across four orders of magnitude points to physics rather than local conditions."]]]

  const dict = I18N[S.set.lang];
  return (dict && dict[str]) || str;
}

 * Walks the rendered DOM and swaps exact interface strings. Doing it after
 * render rather than wrapping every literal means static markup and generated
 * markup are handled the same way, and a missing key simply stays English.
 * Always translates from the recorded original, never from what is on screen.
 */
function localize(){
  const lang = S.set.lang || 'en';
  document.documentElement.lang = lang;
  const dict = I18N[lang] || null;   // null for English: restore originals

  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const jobs = [];
  let node;
  while((node = walker.nextNode())){
    const source = ORIGINAL_TEXT.has(node) ? ORIGINAL_TEXT.get(node) : node.nodeValue;
    const raw = source.trim();
    if(!raw) continue;
    if(node.parentElement && node.parentElement.closest(NO_TRANSLATE)) continue;
    const translated = dict && dict[raw];
    if(!translated && !ORIGINAL_TEXT.has(node)) continue;   // nothing to do, nothing to remember
    if(!ORIGINAL_TEXT.has(node)) ORIGINAL_TEXT.set(node, source);
    jobs.push([node, translated ? source.replace(raw, translated) : source]);
  }
  jobs.forEach(([n, value]) => { n.nodeValue = value; });   // mutate after walking

  const attr = (selector, name) => document.querySelectorAll(selector).forEach(el => {
    const keep = 'data-i18n-' + name;
    const source = el.getAttribute(keep) || el.getAttribute(name);
    if(!source) return;
    const translated = dict && dict[source];
    if(!translated && !el.hasAttribute(keep)) return;
    if(!el.hasAttribute(keep)) el.setAttribute(keep, source);
    el.setAttribute(name, translated || source);
  });
  attr('[placeholder]', 'placeholder');
  attr('[title]', 'title');
}

const DEFAULTS = {
  prog:{},
  read:{},
  set:{theme:'t-clear',appTheme:'app-graphite',lang:'en',anim:'anim-fade',interval:30,alpha:7.5,blur:26,radius:22,font:100,speed:420,

  stats:{lastDay:null,streak:0,best:0,days:{},qTotal:0,qCorrect:0,seconds:0}
};
let S = JSON.parse(JSON.stringify(DEFAULTS));

/** Progress record for a single word (created on demand). */
function P(w){
  if(!S.prog[w]) S.prog[w] = {seen:0,box:1,fav:false,ok:0,no:0};
  return S.prog[w];
}
const isLearned = w => P(w).box >= 4;
const learnedCount = () => VOCAB.filter(v=>isLearned(v.word)).length;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    try{ await window.storage.set('tvw:state', JSON.stringify(S)); }catch(e){/* session-only */}
  },400);
}
async function load(){
  try{
    const r = await window.storage.get('tvw:state');
    if(r && r.value){
      const p = JSON.parse(r.value);
      S = Object.assign({},DEFAULTS,p);
      S.set = Object.assign({},DEFAULTS.set,p.set||{});
      S.set.notif = Object.assign({},DEFAULTS.set.notif,(p.set||{}).notif||{});
      S.stats = Object.assign({},DEFAULTS.stats,p.stats||{});
    }
  }catch(e){/* first run, or storage unavailable */}
}

/** Records study activity for today and updates the streak. */
function touchDay(n){
  const t = dayKey();
  S.stats.days[t] = (S.stats.days[t]||0) + (n||1);
  if(S.stats.lastDay !== t){
    const y = dayKey(new Date(Date.now()-864e5));
    S.stats.streak = (S.stats.lastDay === y) ? S.stats.streak+1 : 1;
    S.stats.lastDay = t;
    S.stats.best = Math.max(S.stats.best, S.stats.streak);
  }
  $('#sideStreak').textContent = S.stats.streak;
  save();
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
/** Copies text, falling back to a hidden textarea where the clipboard API is blocked. */
function copyText(text){
  const done = () => toast('Email copied to clipboard.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text,done));
  } else legacyCopy(text,done);
}
function legacyCopy(text,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy'); document.body.removeChild(ta);
    ok ? done() : toast('Copy blocked here — the address is '+text);
  }catch(e){ toast('Copy blocked here — the address is '+text); }
}
/**
 * Opens a link outside the app. Inside Electron a plain <a href> or a
 * location change is intercepted by the shell and may go nowhere, so every
 * outbound link is routed here instead of being left to the browser.
 */
function openExternal(href){
  try{
    if(window.desktop && typeof window.desktop.openExternal === 'function'){
      window.desktop.openExternal(href);
      return true;
    }
    const w = window.open(href, '_blank', 'noopener,noreferrer');
    if(w) return true;
    window.location.href = href;   // last resort, e.g. mailto: in a sandboxed frame
    return true;
  }catch(e){
    return false;
  }
}

function say(word){
  if(!('speechSynthesis' in window)) return toast('Speech is not available in this browser.');
  const u = new SpeechSynthesisUtterance(word); u.lang='en-US'; u.rate=.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
const dots = d => '<span class="dots">'+[1,2,3,4,5].map(i=>
  `<i class="dot" style="${i<=d?'background:'+DCOL[d]:''}"></i>`).join('')+'</span>';

/* ============================================================
   3. WIDGET ENGINE — non-repeating cycle through the whole set
   ============================================================ */
const INTERVALS = [
  {v:30,l:'30 seconds'},{v:60,l:'1 minute'},{v:120,l:'2 minutes'},{v:300,l:'5 minutes'},
  {v:600,l:'10 minutes'},{v:900,l:'15 minutes'},{v:1800,l:'30 minutes'},{v:3600,l:'1 hour'},
  {v:'random',l:'Random interval'}
];
let bag=[], current=null, prevIdx=-1, paused=false, remaining=30;

function refillBag(){
  bag = shuffle(VOCAB.map((_,i)=>i));
  // never let a fresh cycle repeat the word already on screen
  if(bag.length>1 && bag[bag.length-1]===prevIdx){ [bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]; }
}
function periodSeconds(){
  const iv = S.set.interval;
  if(iv === 'random') return INTERVALS[rnd(INTERVALS.length-1)].v;
  return Number(iv)||30;
}
function nextWord(){
  if(!bag.length) refillBag();
  const idx = bag.pop();
  prevIdx = idx;
  current = VOCAB[idx];
  P(current.word).seen++;
  remaining = periodSeconds();
  paintWidgets(true);
  save();
}
function fmtLeft(s){ return s>=60 ? Math.ceil(s/60)+'m' : s+'s'; }
/** Human label for the current interval, safe if the stored value is unknown. */
function intervalLabel(){
  const m = INTERVALS.find(i=>String(i.v)===String(S.set.interval));
  return m ? m.l : '30 seconds';
}

function widgetHTML(size, v){
  const p = P(v.word);
  const star = `<i class="fav ${p.fav?'on':''}" data-fav="${esc(v.word)}">${p.fav?'★':'☆'}</i>`;
  // core-tier words carry no IPA, example or mnemonic — those blocks are simply omitted
  const ipaLine = v.ipa ? `${esc(v.ipa)} &middot; <span class="pos">${esc(v.pos)}</span>`
                        : `<span class="pos">${esc(v.pos)}</span>`;
  const exBlock  = v.example ? `<div class="ex">${esc(v.example)}</div>` : '';
  const tipBlock = v.tip ? `<div class="tip">&#128161; ${esc(v.tip)}</div>` : '';
  const sig = `<div class="sig">${esc(DEV.name)}</div>`;
  if(size==='small') return `<div class="wg-body">${star}
    <div class="w">${esc(v.word)}</div>
    <div class="m">${esc(v.meaning)}</div>
    <div class="meta"><span class="cat">${esc(v.cat)}</span>${dots(v.diff)}</div>${sig}</div>`;
  if(size==='medium') return `<div class="wg-body">${star}
    <div class="w">${esc(v.word)}</div>
    <div class="ipa">${ipaLine}</div>
    <div class="m">${esc(v.meaning)}</div>
    ${exBlock || `<div class="ex">${esc(v.syn)}</div>`}
    <div class="meta"><span class="cat">${esc(v.sec)} section</span>${dots(v.diff)}</div>${sig}</div>`;
  return `<div class="wg-body">${star}
    <div class="w">${esc(v.word)}</div>
    <div class="ipa">${ipaLine}</div>
    <div class="m">${esc(v.meaning)}</div>
    ${exBlock}
    <div class="sa">
      <div><span class="lbl2">Synonyms</span>${esc(v.syn)}</div>
      <div><span class="lbl2">Antonyms</span>${esc(v.ant||'—')}</div>
    </div>
    ${tipBlock}
    <div class="meta"><span class="cat">${esc(v.cat)} &middot; box ${p.box}/5</span>${dots(v.diff)}</div>${sig}</div>`;
}
function paintWidgets(animate){
  const els = [['#wgS','small'],['#wgM','medium'],['#wgL','large']].filter(([sel]) => $(sel));
  if(!els.length) return;   // deck removed; Today reads `current` directly
  const d = S.set.speed;
  const write = () => els.forEach(([sel,size])=>{ $(sel).innerHTML = widgetHTML(size,current); });
  if(!animate){ write(); return; }
  els.forEach(([sel])=>{ const b=$(sel).firstElementChild; if(b) b.classList.add('out'); $(sel).classList.add('out'); });
  setTimeout(()=>{
    write();
    els.forEach(([sel])=>{ $(sel).classList.remove('out'); const b=$(sel).firstElementChild; if(b) b.classList.add('in'); });
  }, d*0.55);
}
/**
 * Builds the falling petals for the pink theme. They exist in the DOM only
 * once pink has actually been chosen, so no other palette pays for the
 * animation, and they are skipped entirely when the person has asked for
 * reduced motion.
 */
function buildPetals(){
  const host = $('#petals');
  if(!host || host.childElementCount) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const petals = [];
  for(let i = 0; i < 20; i++){
    const size = 10 + Math.random() * 11;
    petals.push(`<i style="
      left:${(Math.random() * 100).toFixed(2)}%;
      width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;
      animation-duration:${(11 + Math.random() * 11).toFixed(1)}s;
      animation-delay:-${(Math.random() * 20).toFixed(1)}s;"></i>`);
  }
  host.innerHTML = petals.join('');
}

/** Applies the app palette to <body>. Separate so it runs with or without a deck. */
const LIGHT_THEMES = ['app-pink', 'app-light', 'app-yellow'];
const PETAL_THEMES = ['app-pink', 'app-yellow'];

function paintAppTheme(st){
  APP_THEMES.forEach(t => document.body.classList.remove(t.k));
  const theme = APP_THEMES.some(t => t.k === st.appTheme) ? st.appTheme : 'app-graphite';
  document.body.classList.add(theme);
  // one shared surface treatment for every light palette, rather than three copies
  document.body.classList.toggle('is-light', LIGHT_THEMES.includes(theme));
  document.body.classList.toggle('has-petals', PETAL_THEMES.includes(theme));
  if(PETAL_THEMES.includes(theme)) buildPetals();
}

function applySettings(){
  const st = S.set, deck = $('#deck'), r = document.documentElement.style;
  paintAppTheme(st);
  if(!deck) return;
  deck.className = 'widgets ' + st.theme + ' ' + st.anim;
  deck.style.setProperty('--wg-bg', null);
  r.setProperty('--anim-ms', st.speed+'ms');
  deck.style.setProperty('--wg-blur', st.blur+'px');
  deck.style.setProperty('--wg-radius', st.radius+'px');
  deck.style.setProperty('--wg-font', (st.font/100));
  // transparency slider drives the frosted fill of every widget
  const a = st.alpha/100;
  const tint = {'t-clear':`rgba(255,255,255,${a})`,'t-midnight':`rgba(8,11,22,${Math.min(.95,a*8)})`,
    't-pink':`rgba(255,214,232,${a*2})`,'t-blue':`rgba(120,170,255,${a*2})`,
    't-mono':`rgba(0,0,0,${Math.min(.95,a*7)})`,'t-light':`rgba(255,255,255,${Math.min(.95,a*9)})`}[st.theme];
  deck.style.setProperty('--wg-bg', tint);
}

/* ------------------------------------------------------------
   Quote rotation. Deliberately app-only: the widgets are for
   vocabulary, and a rotating quote there would compete with the
   word for attention.
   ------------------------------------------------------------ */
const QUOTE_SECONDS = 25;
let quoteBag = [], quote = null, quoteLeft = QUOTE_SECONDS;

function nextQuote(animate){
  if(!quoteBag.length) quoteBag = shuffle(QUOTES.map((_, i) => i));
  const idx = quoteBag.pop();
  quote = QUOTES[idx];
  quoteLeft = QUOTE_SECONDS;
  paintQuote(animate);
}

function paintQuote(animate){
  const host = $('#quoteBody');
  if(!host || !quote) return;               // only exists on the Today screen
  const write = () => {
    host.innerHTML = `<div class="qt">${esc(quote[0])}</div>
      <div class="qa">— <b>${esc(quote[1])}</b></div>`;
  };
  if(!animate){ write(); return; }
  host.classList.add('out');
  setTimeout(() => { write(); host.classList.remove('out'); }, 300);
}

/* clock + master 1-second tick */
setInterval(()=>{
  const n = new Date();
  $('#clock').textContent = n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  S.stats.seconds++;
  if(!paused){
    remaining--;
    if(remaining<=0) nextWord();
  }
  if(VIEW === 'today' && --quoteLeft <= 0) nextQuote(true);

  // reading timer: counts only while a passage is open and not paused
  if(VIEW === 'reading' && openPassage !== null && !readPaused){
    const r = RP(openPassage);
    r.seconds++;
    const el = $('#readTimer');
    if(el) el.textContent = mmss(r.seconds);
    if(r.seconds % 15 === 0) save();
  }
  const cd = $('#cd'); if(cd) cd.textContent = paused ? 'paused' : fmtLeft(Math.max(0,remaining));
},1000);

  deck = VOCAB.slice().sort((a,a2)=>{

    return pa.box-pb.box || pa.seen-pb.seen || Math.random()-.5;
  }).slice(0,24);
  if(startWord){
    const w = VOCAB.find(x=>x.word===startWord);

       <div class="kv"><span class="lbl">Synonyms</span><p>${esc(v.syn||'—')}</p></div>

function grade(g){
  const v = deck[di]; if(!v) return;
  const p = P(v.word);
  if(g===0){ p.box=1; p.no++; }
  else if(g===1){ p.box=Math.max(1,p.box-1); p.no++; }
  else if(g===2){ p.box=Math.min(5,p.box+1); p.ok++; }
  else { p.box=Math.min(5,p.box+2); p.ok++; }
  p.seen++;
  touchDay(1); di++; flipped=false; renderCards(); paintWidgets(false); refreshBadges();
}

/* ---------- Quiz ---------- */
const MODES = [
  {k:'w2m', l:'Word → meaning'},
  {k:'m2w', l:'Meaning → word'},
  {k:'blank', l:'Fill in the blank'},
  {k:'ipa', l:'Pronunciation recognition'},
  {k:'type', l:'Typing mode'}
];
let Q = null;
function renderQuiz(){
  if(!Q) return quizSetup();
  if(Q.i >= Q.items.length) return quizResults();
  const it = Q.items[Q.i];
  let prompt='', opts='';
  if(it.mode==='w2m') prompt = esc(it.v.word);
  if(it.mode==='m2w') prompt = esc(it.v.meaning);
  if(it.mode==='ipa') prompt = `<span style="font-family:var(--font-mono);font-size:26px">${esc(it.v.ipa)}</span>`;
  if(it.mode==='blank'){
    const safe = it.v.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); // imported words may contain regex characters
    prompt = esc(it.v.example).replace(new RegExp(safe,'i'),'<em></em>');
  }
  if(it.mode==='type') prompt = esc(it.v.meaning);

  if(it.mode==='type'){
    opts = `<div style="max-width:420px;margin-top:22px">
      <input type="text" id="typeIn" placeholder="Type the word" autocomplete="off" spellcheck="false">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="typeGo">Check answer</button>
      <button class="btn ghost" id="typeSkip">Skip</button></div>
      <div id="typeFb" style="margin-top:14px;font-size:13.5px"></div></div>`;
  } else {
    opts = `<div class="q-opts">${it.opts.map((o,n)=>
      `<button class="opt" data-opt="${n}">${esc(o)}</button>`).join('')}</div>`;
  }
  $('#v-quiz').innerHTML = `
   <div class="head">
     <div class="eyebrow">${MODES.find(m=>m.k===it.mode).l} · question ${Q.i+1} of ${Q.items.length} · score ${Q.score}</div>
     <h2 style="font-size:15px;letter-spacing:0;font-family:var(--font-ui);color:var(--ink-2);font-weight:500">
       ${it.mode==='m2w'||it.mode==='type'?'Which word means this?':it.mode==='ipa'?'Which word is transcribed here?':it.mode==='blank'?'Complete the sentence.':'What does this word mean?'}</h2>
   </div>
   <div class="qbar"><i style="width:${(Q.i/Q.items.length)*100}%"></i></div>
   <div class="prompt">${prompt}</div>
   ${opts}
   <div class="row" style="margin-top:26px"><button class="btn sm ghost" id="quitQuiz">End quiz</button></div>`;
  if(it.mode==='type') setTimeout(()=>$('#typeIn') && $('#typeIn').focus(),60);
}
function quizSetup(){
  $('#v-quiz').innerHTML = `
   <div class="head">
     <div class="eyebrow">${VOCAB.length} words available</div>
     <h2>Quiz</h2>
     <p>Pick the question types you want. Wrong answers drop that word back to Leitner box 1, so it returns sooner in flashcards.</p>
   </div>
   <span class="lbl">Question types</span>
   <div class="filters" id="modePick">${MODES.map((m,i)=>
     `<button class="chip ${i<2?'on':''}" data-mode="${m.k}">${m.l}</button>`).join('')}</div>
   <span class="lbl">Length</span>
   <div class="filters" id="lenPick">
     ${[5,10,20].map((n,i)=>`<button class="chip ${n===10?'on':''}" data-len="${n}">${n} questions</button>`).join('')}
   </div>
   <button class="btn primary" id="startQuiz" style="margin-top:10px">Start quiz</button>`;

/** Words eligible for a mode — blanks need an example, IPA mode needs a transcription. */
function poolFor(mode){
  if(mode==='blank') return VOCAB.filter(v=>v.example);
  if(mode==='ipa')   return VOCAB.filter(v=>v.ipa);
  return VOCAB;
}
function makeQuiz(modes,len){
  const usable = modes.filter(m=>poolFor(m).length>=4);
  if(!usable.length){ toast('Those types need example sentences or pronunciation. Try word or meaning modes.'); return; }
  const items = [], used = new Set();
  for(let i=0;i<len;i++){
    const mode = usable[rnd(usable.length)];
    const pool = poolFor(mode).filter(x=>!used.has(x.word));
    if(!pool.length) break;
    const v = pool[rnd(pool.length)];
    used.add(v.word);
    const it = {v,mode};
    if(mode!=='type'){
      const others = shuffle(VOCAB.filter(x=>x.word!==v.word)).slice(0,3);
      const field = (mode==='w2m') ? 'meaning' : 'word';
      const correct = v[field];
      it.opts = shuffle([correct].concat(others.map(o=>o[field])));
      it.answer = it.opts.indexOf(correct);
    }
    items.push(it);
  }
  Q = {items, i:0, score:0, missed:[]};
}
function answer(n){
  const it = Q.items[Q.i];
  const ok = n === it.answer;
  const btns = $$('#v-quiz .opt');
  btns.forEach((b,k)=>{ b.disabled=true;
    if(k===it.answer) b.classList.add('right');
    else if(k===n) b.classList.add('wrong'); });
  score(ok, it);
  setTimeout(()=>{ Q.i++; renderQuiz(); }, ok?600:1250);
}
function score(ok,it){
  const p = P(it.v.word);
  S.stats.qTotal++;
  if(ok){ S.stats.qCorrect++; Q.score++; p.ok++; p.box=Math.min(5,p.box+1); }
  else { p.no++; p.box=1; Q.missed.push(it.v); }
  p.seen++; touchDay(1); refreshBadges(); save();
}
function quizResults(){
  const acc = Math.round(Q.score/Q.items.length*100);
  const missed = Q.missed;
  $('#v-quiz').innerHTML = `
   <div class="head"><div class="eyebrow">Session complete</div><h2>${Q.score} of ${Q.items.length} correct</h2></div>
   <div class="stat-grid">
     <div class="card stat"><b>${acc}%</b><span>Accuracy</span></div>
     <div class="card stat"><b>${Q.score}</b><span>Correct</span></div>
     <div class="card stat"><b>${Q.items.length-Q.score}</b><span>To review</span></div>
     <div class="card stat"><b>${S.stats.streak}</b><span>Day streak</span></div>
   </div>
   ${missed.length?`<div class="sec-title">Back to box 1</div>
     <div class="lib">${missed.map(v=>libRow(v)).join('')}</div>`:
     `<div class="empty">Clean sweep. Every word moved up a Leitner box.</div>`}
   <div class="row" style="margin-top:24px">
     <button class="btn primary" id="newQuiz">New quiz</button>
     <button class="btn" data-go="cards">Review in flashcards</button>
   </div>`;
  Q = null;
}

/* ---------- Reading ---------- */
const RK = ['title','cat','diff','text','qs'];
let PASSAGES = [];        // filled from READING once the data block has loaded
let openPassage = null;   // index of the passage being read, or null for the list

/** Per-passage record: which questions were answered and whether correctly. */
function RP(i){
  if(!S.read[i]) S.read[i] = {answers:{}, correct:0, done:false};
  const r = S.read[i];
  if(!r.hl) r.hl = [];          // highlighted phrases, stored as text
  if(r.notes === undefined) r.notes = '';
  if(r.seconds === undefined) r.seconds = 0;
  return r;
}
const passageDone = i => {
  const p = PASSAGES[i];
  return p && Object.keys(RP(i).answers).length >= p.qs.length;
};
const readCounts = () => {
  const done = PASSAGES.filter((_, i) => passageDone(i)).length;
  return {done, total: PASSAGES.length};
};

function renderReading(){
  if(openPassage !== null && PASSAGES[openPassage]) return renderPassage(openPassage);

  const cats = ['All'].concat([...new Set(PASSAGES.map(p => p.cat))].sort());

    if(RF.diff && p.diff !== RF.diff) return false;
    if(RF.state === 'done' && !passageDone(i)) return false;

    return true;
  });

   </div>

     <button class="chip ${RF.state==='all'?'on':''}" data-rstate="all">All</button>

   </div>

     const r = RP(i), answered = Object.keys(r.answers).length;

         <div class="meta"><span class="cat">${passageDone(i) ? 'Completed' : 'In progress'}</span>

   }).join('')}</div>` : `<div class="empty">No passages match those filters.</div>`}`;
}

const mmss = t => `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
const reEscape = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/**
 * Question types are inferred from the wording rather than stored, so the
 * labels stay correct for imported passages that carry no type field.
 */
function questionType(text){
  const t = text.toLowerCase();
  if(/main (idea|purpose|point)|primarily|best title|mainly discuss/.test(t)) return 'Main idea';
  if(/closest in meaning|the word .* refers|as used in the passage/.test(t)) return 'Vocabulary';
  if(/\bexcept\b|\bnot\b mentioned|least likely/.test(t)) return 'Negative factual';
  if(/why does|in order to|the author mention|does the passage mention/.test(t)) return 'Purpose';
  if(/suggest|imply|infer|can be concluded|most likely/.test(t)) return 'Inference';
  return 'Detail';
}

/** Rebuilds the passage HTML with stored highlights re-applied. */
function passageHTML(p, highlights){
  return p.text.split('\n\n').map(par => {
    let html = esc(par);
    for(const phrase of highlights){
      if(!phrase) continue;
      html = html.replace(new RegExp(reEscape(esc(phrase)), 'g'), m => `<mark>${m}</mark>`);
    }
    return `<p>${html}</p>`;
  }).join('');
}

let notesOpen = false, readPaused = false;

function renderPassage(i){
  const p = PASSAGES[i], r = RP(i);

     </div>` : ''}

     ${p.qs.map((q, n) => {

}

/** Grades one answer, records it, and folds the result into the daily stats. */
function answerReading(pi, qi, choice){
  const p = PASSAGES[pi], r = RP(pi);
  if(!p || r.answers[qi] !== undefined) return;   // already answered
  const correct = choice === p.qs[qi][5];
  r.answers[qi] = choice;
  if(correct) r.correct++;
  r.done = Object.keys(r.answers).length >= p.qs.length;
  S.stats.qTotal++;
  if(correct) S.stats.qCorrect++;
  touchDay(1);
  save();
  refreshBadges();
  renderPassage(pi);
  localize();
}

/**

function handleSelection(){
  const bar = $('#selBar');
  if(!bar) return;
  const sel = window.getSelection();
  const text = sel ? String(sel).trim() : '';
  const host = $('#passageText');
  if(!text || !host || !sel.rangeCount || !host.contains(sel.anchorNode)){

/** Looks a word up in the loaded vocabulary and shows a small card. */
function showLookup(raw, x, y){
  const card = $('#lookup');
  if(!card) return;
  const term = String(raw).trim().toLowerCase().replace(/^[^a-z]+|[^a-z]+$/g, '');
  if(!term) return;
  // try the exact word, then a simple stem, since passages inflect
  const hit = VOCAB.find(v => v.word.toLowerCase() === term)
    || VOCAB.find(v => term.startsWith(v.word.toLowerCase()) && term.length - v.word.length <= 3);
  card.innerHTML = hit
    ? `<i class="lx" data-lookclose="1">&times;</i>
       <div class="lw">${esc(hit.word)}</div>
       <div class="li">${hit.ipa ? esc(hit.ipa) + ' · ' : ''}${esc(hit.pos)}</div>
       <div class="lm">${esc(hit.meaning)}</div>
       <div class="ls">Synonyms: ${esc(hit.syn || '—')}</div>`
    : `<i class="lx" data-lookclose="1">&times;</i>
       <div class="lw">${esc(term)}</div>
       <div class="lm">Not in your word list.</div>
       <div class="ls">Add it through Settings, or search the library.</div>`;
  card.style.display = 'block';
  card.style.left = Math.max(10, Math.min(window.innerWidth - 310, x - 145)) + 'px';
  card.style.top = Math.max(10, Math.min(window.innerHeight - 210, y + 14)) + 'px';
}

<script>
/** Renders one row of theme swatches; special ones get a marker. */
const swatches = (list, current, attr, extra) => list.map(t =>
  `<div class="sw ${extra} ${current===t.k?'on':''} ${t.special?'is-special':''}"
        style="${t.css}" data-${attr}="${t.k}"><span>${t.l}</span></div>`).join('');

/* ---------- Progress ---------- */
function renderProgress(){
  const total=VOCAB.length, done=learnedCount();
  const acc = S.stats.qTotal ? Math.round(S.stats.qCorrect/S.stats.qTotal*100) : 0;
  const mins = Math.floor(S.stats.seconds/60);
  const time = mins>=60 ? Math.floor(mins/60)+'h '+(mins%60)+'m' : mins+'m';
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(Date.now()-i*864e5); days.push({k:dayKey(d),
    l:d.toLocaleDateString([], {weekday:'short'})[0], n:S.stats.days[dayKey(d)]||0}); }
  const peak = Math.max(1,...days.map(d=>d.n));
  const boxes = [1,2,3,4,5].map(b=>VOCAB.filter(v=>P(v.word).box===b).length);

/* ============================================================
   5. IMPORT / EXPORT
   ============================================================ */
function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===',' && !q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out.map(s=>s.trim());
}
function normalize(o){
  if(!o.word || !o.meaning) return null;
  return {word:String(o.word).trim(), pos:o.pos||'—', ipa:o.ipa||'', meaning:String(o.meaning).trim(),
    example:o.example||'', syn:o.syn||o.synonyms||'—', ant:o.ant||o.antonyms||'—',
    diff:Math.min(5,Math.max(1,parseInt(o.diff||o.difficulty||3))), cat:o.cat||o.category||'Imported', tier:'imported',
    sec:o.sec||o.section||'Reading', tip:o.tip||o.mnemonic||'Add your own memory trick for this one.'};
}
/**
 * Decides whether a file holds vocabulary or reading passages and routes it.
 * Detection is on shape rather than filename, because both arrive as .json and
 * a person should not have to remember which button belongs to which file.
 */
function looksLikePassages(text){
  try{
    const parsed = JSON.parse(text);
    const rows = Array.isArray(parsed) ? parsed : (parsed.passages || parsed.items);
    if(!Array.isArray(rows) || !rows.length) return false;
    const first = rows[0];
    if(Array.isArray(first)) return first.length >= 5 && Array.isArray(first[4]);
    return !!(first && (first.questions || first.qs) && (first.text || first.passage));
  }catch(e){ return false; }
}

function importAny(name, text){
  return looksLikePassages(text) ? importPassages(text) : importText(name, text);
}

function importText(name, text){
  let rows=[];
  try{
    if(/\.json$/i.test(name)){
      const j = JSON.parse(text);
      const arr = Array.isArray(j) ? j : (j.vocab||j.words||[]);
      rows = arr.map(normalize).filter(Boolean);
      if(j.progress) { S.prog = Object.assign(S.prog, j.progress); }
    } else if(/\.csv$/i.test(name)){
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      const head = splitCSV(lines[0]).map(h=>h.toLowerCase());
      rows = lines.slice(1).map(l=>{
        const c = splitCSV(l), o={}; head.forEach((h,i)=>o[h]=c[i]); return normalize(o);
      }).filter(Boolean);
    } else {
      rows = text.split(/\r?\n/).map(l=>{
        const m = l.split(/\s+[—–\-:|]\s+|\t/);
        return m.length>=2 ? normalize({word:m[0], meaning:m.slice(1).join(' ')}) : null;
      }).filter(Boolean);
    }
  }catch(e){ return toast('That file could not be read. Check the format and try again.'); }
  if(!rows.length) return toast('No usable rows found. Each entry needs a word and a meaning.');
  const seen = new Set(VOCAB.map(v=>v.word.toLowerCase()));
  const fresh = rows.filter(r=>!seen.has(r.word.toLowerCase()));
  VOCAB = VOCAB.concat(fresh);
  refillBag(); refreshBadges(); render(VIEW); paintWidgets(false); save();
  toast(`Imported ${fresh.length} new words (${rows.length-fresh.length} already in library).`);
}
/**
 * Imports reading passages from JSON. Accepts either the compact array form the
 * app exports or a list of objects, and validates each one, because a passage
 * with a bad answer index would silently teach the wrong answer.
 */
function importPassages(text){
  let rows;
  try{
    const parsed = JSON.parse(text);
    rows = Array.isArray(parsed) ? parsed : (parsed.passages || parsed.items);
  }catch(e){ return toast('That file is not valid JSON.'); }
  if(!Array.isArray(rows)) return toast('Expected a list of passages.');

  const clean = [], reasons = [];
  rows.forEach((row, i) => {
    const o = Array.isArray(row)
      ? {title:row[0], cat:row[1], diff:row[2], text:row[3], qs:row[4]}
      : {title:row.title, cat:row.category || row.cat, diff:row.difficulty || row.diff,
         text:row.text || row.passage, qs:row.questions || row.qs};
    if(!o.title || !o.text || !Array.isArray(o.qs) || !o.qs.length){
      reasons.push(`#${i+1} missing title, text or questions`); return;
    }
    const qs = [];
    for(const q of o.qs){
      const arr = Array.isArray(q)
        ? q
        : [q.question, ...(q.options||[]), q.answer, q.explanation || ''];
      if(arr.length < 7 || !arr[0]) { reasons.push(`#${i+1} malformed question`); return; }
      const key = Number(arr[5]);
      if(!(key >= 0 && key <= 3)) { reasons.push(`#${i+1} answer index out of range`); return; }
      qs.push([String(arr[0]), String(arr[1]), String(arr[2]), String(arr[3]), String(arr[4]),
               key, String(arr[6] || '')]);
    }
    clean.push({title:String(o.title).slice(0,120), cat:String(o.cat || 'Imported').slice(0,40),
      diff:Math.min(5, Math.max(1, Number(o.diff) || 3)), text:String(o.text), qs, tier:'imported'});
  });

  if(!clean.length) return toast('No usable passages found. ' + (reasons[0] || ''));
  const have = new Set(PASSAGES.map(x => x.title.toLowerCase()));
  const fresh = clean.filter(x => !have.has(x.title.toLowerCase()));
  PASSAGES = PASSAGES.concat(fresh);
  refreshBadges(); render('reading'); save();
  toast(`Imported ${fresh.length} passages` +
    (clean.length - fresh.length ? `, skipped ${clean.length - fresh.length} already present` : '') +
    (reasons.length ? `, rejected ${reasons.length}` : '') + '.');
}

function download(name, text, type){
  const b = new Blob([text],{type}); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),400);
  toast('Saved '+name);
}

/* ============================================================
   6. WIRING
   ============================================================ */
function refreshBadges(){
  $('#dueBadge').textContent = VOCAB.filter(v=>P(v.word).box<=2).length;
  const rc = readCounts();
  $('#readBadge').textContent = `${rc.done}/${rc.total}`;
  $('#libBadge').textContent = VOCAB.length;
  $('#sideStreak').textContent = S.stats.streak;
}
function render(v){
  VIEW = v;
  $$('.view').forEach(e=>e.classList.remove('on'));
  $('#v-'+v).classList.add('on');
  $$('.nav').forEach(n=>n.classList.toggle('on', n.dataset.view===v));
  ({today:renderToday,cards:renderCards,quiz:renderQuiz,reading:renderReading,
    library:renderLibrary,progress:renderProgress,settings:renderSettings}[v])();
  if(v === 'today') afterToday();
  localize();
}

document.addEventListener('click', e=>{
  // Outbound links first: mail clients and browsers, never inside the app frame.
  const link = e.target.closest('a[href]');
  if(link){
    const href = link.getAttribute('href') || '';
    if(/^(mailto:|https?:)/i.test(href)){
      e.preventDefault();
      if(!openExternal(href)) toast('Could not open that link. The address is ' + href.replace(/^mailto:/, ''));
      return;
    }
  }

  const t = e.target.closest('[data-view],[data-go],[data-say],[data-open],[data-fav],[data-grade],[data-theme],[data-anim],[data-diff],[data-state],[data-favf],[data-mode],[data-len],[data-opt],[data-notif],[data-card],[data-apptheme],[data-lang],[data-passage],[data-answer],[data-rdiff],[data-rstate],[data-seltool],[data-lookclose],.fc,button');
  if(!t) return;
  const d = t.dataset;

  if(d.view) return render(d.view);
  if(d.go)   return render(d.go);
  if(d.say)  return say(d.say);

  if(d.fav){ const p=P(d.fav); p.fav=!p.fav; save(); paintWidgets(false);
             if(VIEW==='library'||VIEW==='today'||VIEW==='cards') render(VIEW); return; }
  if(d.open){ LF.detail=d.open; return render('library'); }
  if(d.card){ buildDeck(d.card); return render('cards'); }
  if(d.pin){ current = VOCAB.find(x=>x.word===d.pin); remaining=periodSeconds(); paintWidgets(true);
             return toast('Now showing on your widgets.'); }

  if(t.classList.contains('fc')){ flipped=!flipped; t.classList.toggle('flip'); return; }
  if(t.classList.contains('wg')){ if(current) buildDeck(current.word); return render('cards'); }
  if(d.grade!==undefined) return grade(Number(d.grade));

  if(d.apptheme){ S.set.appTheme=d.apptheme; applySettings(); save(); return render(VIEW); }
  if(d.lang){ S.set.lang=d.lang; save(); return render(VIEW); }

  if(d.passage!==undefined){ openPassage=Number(d.passage); render('reading'); return; }
  if(d.answer){ const [pi,qi,k]=d.answer.split(':').map(Number); return answerReading(pi,qi,k); }
  if(d.lookclose){ $('#lookup').style.display='none'; return; }
  if(d.seltool){
    const sel = window.getSelection();
    const text = sel ? String(sel).trim() : '';
    if(!text) return;
    if(d.seltool === 'highlight'){
      const r = RP(openPassage);
      if(!r.hl.includes(text)) r.hl.push(text);
      save(); sel.removeAllRanges(); $('#selBar').style.display='none';
      renderPassage(openPassage); localize();
    } else {
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      showLookup(text.split(/\s+/)[0], rect.left + rect.width/2, rect.bottom);
      $('#selBar').style.display='none';
    }
    return;
  }
  if(d.rdiff!==undefined){ RF.diff=Number(d.rdiff); return renderReading(); }
  if(d.rstate){ RF.state=d.rstate; return renderReading(); }
  if(d.diff!==undefined){ LF.diff=Number(d.diff); LF.limit=PAGE; return renderLibrary(); }
  if(d.state){ LF.state=d.state; LF.limit=PAGE; return renderLibrary(); }
  if(d.favf){ LF.fav=!LF.fav; LF.limit=PAGE; return renderLibrary(); }

  if(d.mode!==undefined){ t.classList.toggle('on'); return; }
  if(d.len!==undefined){ $$('#lenPick .chip').forEach(c=>c.classList.remove('on')); t.classList.add('on'); return; }
  if(d.opt!==undefined) return answer(Number(d.opt));
  if(d.notif){ S.set.notif[d.notif]=!S.set.notif[d.notif]; t.classList.toggle('on'); save();
    return toast(S.set.notif[d.notif]?'Reminder on.':'Reminder off.'); }

  switch(t.id){
    case 'btnPause': paused=!paused;
      t.innerHTML = paused ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>'
        : '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
      toast(paused?'Auto-refresh paused.':'Auto-refresh running.'); break;
    case 'btnNext': case 'skipWord': case 'cycleNow':
      nextWord(); if(VIEW==='today'){ renderToday(); afterToday(); } break;
    case 'quoteNext': nextQuote(true); break;
    case 'favCard': { const p=P(deck[di].word); p.fav=!p.fav; save(); renderCards(); paintWidgets(false); break; }
    case 'againDeck': buildDeck(); renderCards(); break;
    case 'readBack': openPassage=null; notesOpen=false; render('reading'); break;
    case 'readPause': readPaused = !readPaused; renderPassage(openPassage); localize(); break;
    case 'readNotesBtn': notesOpen = !notesOpen; renderPassage(openPassage); localize();
      if(notesOpen && $('#readNotes')) $('#readNotes').focus(); break;
    case 'readClearHl': RP(openPassage).hl = []; save(); renderPassage(openPassage); localize(); break;
    case 'readRetry': S.read[openPassage]={answers:{},correct:0,done:false}; save(); render('reading'); break;
    case 'readNext': {
      const next = PASSAGES.findIndex((_,i)=>!passageDone(i));
      openPassage = next >= 0 ? next : null;
      render('reading'); break;
    }
    case 'libBack': LF.detail=null; renderLibrary(); break;
    case 'libMore': LF.limit+=PAGE; renderLibrary(); break;
    case 'startQuiz': {
      const modes = $$('#modePick .chip.on').map(c=>c.dataset.mode);
      if(!modes.length) return toast('Pick at least one question type.');
      const len = Number(($('#lenPick .chip.on')||{dataset:{len:10}}).dataset.len);
      makeQuiz(modes, len); if(Q) renderQuiz(); break; }
    case 'newQuiz': Q=null; renderQuiz(); break;
    case 'quitQuiz': Q=null; renderQuiz(); break;
    case 'favLib': break;
    case 'typeGo': case 'typeSkip': {
      if(!Q || !Q.items[Q.i]) break;
      const it = Q.items[Q.i]; const inp = $('#typeIn'); const val = ((inp&&inp.value)||'').trim().toLowerCase();
      const ok = t.id==='typeGo' && val === it.v.word.toLowerCase();
      const fb = $('#typeFb');
      if(fb) fb.innerHTML = ok ? `<span style="color:var(--d1)">Correct.</span>`
        : `<span style="color:var(--d5)">Answer: <b>${esc(it.v.word)}</b></span>`;
      score(ok,it); setTimeout(()=>{Q.i++; renderQuiz();}, ok?600:1400); break; }
    case 'copyMail': copyText(DEV.email); break;
    case 'mailDev': {
      const to = `mailto:${DEV.email}?subject=${encodeURIComponent('TOEFL Preparation App')}`;
      if(!openExternal(to)) toast('Could not open your mail app. The address is ' + DEV.email);
      break;
    }
    case 'devGithub': openExternal(DEV.github); break;
    case 'pickFile': case 'drop': $('#fileIn').click(); break;
    case 'expRead': download('toefl-passages.json',
      JSON.stringify(PASSAGES.map(p => ({title:p.title, category:p.cat, difficulty:p.diff,
        text:p.text, questions:p.qs.map(q => ({question:q[0], options:q.slice(1,5),
        answer:q[5], explanation:q[6]}))})), null, 2), 'application/json'); break;
    case 'expJson': download('toefl-vocab-backup.json',
      JSON.stringify({exported:new Date().toISOString(), vocab:VOCAB, progress:S.prog, stats:S.stats},null,2),
      'application/json'); break;
    case 'expCsv': download('toefl-vocab.csv',
      'word,pos,ipa,meaning,example,syn,ant,diff,cat,sec,tip\n' +
      VOCAB.map(v=>K.map(k=>`"${String(v[k]).replace(/"/g,'""')}"`).join(',')).join('\n'),
      'text/csv'); break;
    case 'resetProg': if(confirm('Reset all progress, streaks and statistics? Vocabulary stays.')){
      S.prog={}; S.stats=JSON.parse(JSON.stringify(DEFAULTS.stats)); save(); refreshBadges();
      buildDeck(); render(VIEW); paintWidgets(false); toast('Progress reset.'); } break;
    case 'resetAll': if(confirm('Remove imported words and restore the built-in word list?')){
      VOCAB = buildVocab();
      refillBag(); nextWord(); refreshBadges(); render(VIEW); toast('Default vocabulary restored.'); } break;
  }
});

document.addEventListener('mouseup', () => setTimeout(handleSelection, 0));
document.addEventListener('dblclick', e => {
  const host = $('#passageText');
  if(!host || !host.contains(e.target)) return;
  const sel = window.getSelection();
  const word = sel ? String(sel).trim() : '';
  if(word) showLookup(word, e.clientX, e.clientY);

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id === 'readNotes' && openPassage !== null){
    RP(openPassage).notes = t.value;   // saved without re-rendering, so focus is kept
    save();
    return;
  }
  if(t.dataset.slider){
    const id=t.dataset.slider, v=Number(t.value); S.set[id]=v;
    const unit={alpha:v.toFixed(1)+'%',blur:v+'px',radius:v+'px',font:v+'%',speed:v+'ms'}[id];
    $('#val-'+id).textContent = unit; applySettings(); save();
  }
  if(t.id==='libQ'){
    LF.q=t.value; LF.limit=PAGE;
    const box=$('#libList'), wrap=$('#libMoreWrap'), l=filtered();
    if(box){ box.innerHTML = l.slice(0,LF.limit).map(libRow).join(''); if(wrap) wrap.innerHTML = moreBtn(l.length); }
    else renderLibrary();
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='ivSel'){ S.set.interval = e.target.value; remaining=periodSeconds(); save();
    toast('Widgets now refresh every '+intervalLabel().toLowerCase()+'.'); }
  if(e.target.id==='libCat'){ LF.cat=e.target.value; LF.limit=PAGE; renderLibrary(); }
  if(e.target.id==='readCat'){ RF.cat=e.target.value; renderReading(); }
  if(e.target.id==='fileIn'){
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>importAny(f.name, r.result); r.readAsText(f);
    e.target.value='';
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter' && e.target.id==='typeIn') $('#typeGo').click(); return; }
  if(VIEW==='cards'){
    if(e.key===' '){ e.preventDefault(); const c=$('#fc'); if(c){flipped=!flipped;c.classList.toggle('flip');} }
    if(['1','2','3','4'].includes(e.key)) grade(Number(e.key)-1);
  }
  if(e.key==='ArrowRight' && VIEW!=='cards') nextWord();
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev, e=>{
  const d=$('#drop'); if(!d) return; e.preventDefault();
  d.classList.toggle('hot', ev==='dragover');
  if(ev==='drop' && e.dataTransfer.files[0]){
    const f=e.dataTransfer.files[0], r=new FileReader();
    r.onload=()=> importAny(f.name, r.result);
    r.readAsText(f);
  }
}));

/* ---------- boot ---------- */
(async function init(){
  // The Electron shell provides the window frame, so the app drops its own.
  if(window.desktop && window.desktop.isDesktop){
    document.body.classList.add('is-desktop');
    if(window.desktop.isMac) document.body.classList.add('is-mac');
  }
  await load();
  PASSAGES = buildPassages();
  localize();
  applySettings();
  refillBag();
  nextWord();
  buildDeck();
  refreshBadges();
  render('today');
})();
</script>
