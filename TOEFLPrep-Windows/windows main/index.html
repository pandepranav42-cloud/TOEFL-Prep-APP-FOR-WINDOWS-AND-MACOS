["Writing and the Alphabet", "Linguistics", 4, "Writing was invented independently perhaps three or four times, but the alphabet appears to have been invented once. Sumerian cuneiform and Chinese characters began as signs for words. Egyptian hieroglyphs included signs for consonant sounds, but retained hundreds of word signs alongside them.\n\nThe decisive step came from workers in the Sinai around 1800 BCE who borrowed a small set of Egyptian signs and used them purely for the sounds their Egyptian names began with. A sign for a house, per, came to stand for the sound p. The result needed a few dozen characters rather than several hundred, and every later alphabet, Phoenician, Greek, Latin, Arabic and the Indic scripts, descends from that adaptation.\n\nWhy it happened only once is unclear. The idea is simple in hindsight, but it required treating a sign as a sound rather than a thing.", [["According to the passage, the crucial innovation was", "using existing signs for their initial sounds", "reducing the number of words in a language", "inventing entirely new signs", "writing from left to right", 0, "Sinai workers used Egyptian signs purely for the sounds their names began with."], ["What advantage did the alphabet offer?", "It could record more languages at once", "It was faster to carve in stone", "It preserved word meanings better", "It needed far fewer characters", 3, "The result needed a few dozen characters rather than several hundred."], ["The passage suggests the invention was difficult because it required", "treating a sign as a sound rather than a thing", "a large population of literate workers", "a writing surface that did not exist", "access to Egyptian scribal schools", 0, "The last sentence identifies exactly this conceptual shift."]]],
["Sleep and Memory", "Psychology", 3, "Sleep does not merely rest the brain; it processes what the waking day supplied. During slow-wave sleep, patterns of neural firing recorded during learning are replayed, and the replay appears to strengthen connections in the cortex where long-term memories reside.\n\nExperiments make the link concrete. Volunteers who learn a sequence of finger movements and then sleep perform measurably better the next morning than volunteers who learn it in the morning and are tested after an equal interval awake. The improvement arrives during sleep rather than with practice.\n\nSelectivity is the interesting part. Not everything is consolidated. Material that participants were told would be tested is retained better than material they believed irrelevant, which suggests the sleeping brain is acting on a decision the waking brain made about what matters.", [["What does the finger-movement experiment demonstrate?", "Sleep has no effect on motor skills", "Practice in the morning is more effective", "Improvement occurs during sleep rather than practice", "Testing interferes with learning", 2, "Those who slept improved more than those awake for an equal interval, so gain came during sleep."], ["According to the passage, memories are consolidated", "selectively, according to expected relevance", "indiscriminately", "only during dreaming", "only if rehearsed while asleep", 0, "Material expected to be tested was retained better, indicating selectivity."], ["The passage suggests that the sleeping brain", "operates independently of waking intentions", "works only on verbal material", "replaces waking memory entirely", "acts on priorities set while awake", 3, "The final clause says it acts on a decision the waking brain made about what matters."]]],
["The Columbian Exchange", "History", 3, "The transfer of organisms between the Americas and the rest of the world after 1492 reshaped both. Maize and the potato moved east and raised the ceiling on European and Chinese populations, since both yield more calories per hectare than the grains they supplemented. Cassava did the same across parts of Africa.\n\nMovement in the other direction was more destructive. Smallpox, measles and influenza had circulated in Eurasia for millennia, and populations there carried partial resistance. American populations had none, and mortality in the century after contact reached levels that historians still debate but that were certainly catastrophic.\n\nThe exchange was therefore asymmetric in kind rather than in volume: the Americas contributed crops that supported growth, and received diseases that caused collapse.", [["What is the main point of the passage?", "Disease resistance is inherited", "The exchange was asymmetric in its effects", "The exchange moved more species west than east", "European crops were superior to American ones", 1, "The final sentence states the asymmetry in kind: crops one way, disease the other."], ["Why did American populations suffer so heavily from Eurasian diseases?", "The diseases mutated on arrival", "They had no prior exposure and no partial resistance", "Their settlements were unusually dense", "They lacked any medical tradition", 1, "Eurasian populations carried partial resistance from millennia of exposure; American populations had none."], ["According to the passage, maize and the potato mattered because they", "required no cultivation", "produced more calories per hectare", "were easier to store", "resisted disease", 1, "Both yield more calories per hectare than the grains they supplemented."]]],
["Why the Sky Is Blue", "Physics", 2, "Sunlight contains all visible wavelengths. When it enters the atmosphere it strikes molecules much smaller than the waves themselves, and those molecules scatter it. The efficiency of this scattering depends steeply on wavelength: shorter waves are scattered far more than longer ones, by a factor that rises as the fourth power of frequency.\n\nBlue and violet are therefore thrown across the sky in every direction, while red passes more directly through. The sky we see is scattered short-wavelength light arriving from everywhere but the sun.\n\nWhy blue and not violet, which scatters even more? Partly because sunlight contains less violet to begin with, and partly because the human eye is markedly less sensitive to it. The colour of the sky is a fact about our eyes as much as about the air.", [["According to the passage, blue dominates the sky because short wavelengths", "are emitted by the atmosphere", "are scattered much more efficiently", "travel faster through air", "are absorbed by molecules", 1, "Scattering efficiency rises steeply for shorter wavelengths."], ["Why is the sky not violet?", "Violet does not scatter", "Violet is absorbed by ozone entirely", "Violet scatters only at sunset", "Sunlight has less violet and the eye is less sensitive to it", 3, "The passage gives exactly these two reasons."], ["The final sentence implies that the colour of the sky", "is an optical illusion", "changes with altitude", "would look the same to any observer", "depends partly on human vision", 3, "It calls the sky's colour a fact about our eyes as much as about the air."]]],
["The Economics of Lighthouses", "Economics", 4, "Economists long used the lighthouse as the standard illustration of a public good. Its light cannot be withheld from a passing ship, and one ship's use does not diminish another's. Since no operator could charge for it, the argument ran, only a government would ever build one.\n\nRonald Coase examined the British record and found the history less tidy. Many early English lighthouses were built by private parties under royal patent, who recovered costs through dues collected at ports, since a ship that had benefited from the light generally had to dock somewhere. The good was non-excludable at sea but the beneficiaries were identifiable on land.\n\nThe example survives in textbooks, but Coase's point stands: whether a good must be publicly provided is an empirical question, not one settled by its definition.", [["What did Coase's research show?", "Lighthouses are not public goods at all", "Private parties had in fact financed lighthouses", "Government lighthouses were poorly maintained", "Ships avoided paying port dues", 1, "Coase found many early English lighthouses were privately built and funded through port dues."], ["How were private lighthouse operators able to recover costs?", "Through direct government subsidy", "Through dues collected when ships docked", "By selling the land around the lighthouse", "By charging ships at sea", 1, "Dues were collected at ports, since beneficiary ships had to dock somewhere."], ["What broader conclusion does the passage draw?", "Coase disproved the concept of a public good", "Public provision is a question of evidence, not definition", "Textbooks should stop using the lighthouse example", "All public goods can be privately supplied", 1, "The final sentence states it is an empirical question, not settled by definition."]]],
["The Deep Scattering Layer", "Oceanography", 3, "When sonar came into wide use in the 1940s, operators found a puzzling reflection a few hundred metres below the surface, apparently a false sea floor. It rose towards the surface at dusk and sank again at dawn.\n\nThe layer turned out to be alive. It consists of small fish, squid and crustaceans whose gas-filled swim bladders reflect sound, and it moves because the animals do. They spend daylight in dark water where predators that hunt by sight cannot easily find them, and rise at night to feed in the productive surface layer.\n\nThis is now recognised as the largest migration on earth, undertaken daily by an enormous biomass, and it matters far beyond biology: animals feeding at the surface and excreting at depth carry carbon downward every night.", [["What did sonar operators initially believe the layer to be?", "A school of whales", "A layer of sediment", "A false sea floor", "An equipment fault", 2, "The passage says the reflection appeared to be a false sea floor."], ["Why do the animals remain deep during daylight?", "To avoid predators that hunt by sight", "Their swim bladders require pressure", "Food is more abundant at depth", "The water is warmer there", 0, "They spend daylight in dark water where visual predators cannot easily find them."], ["According to the passage, the migration is significant to climate science because it", "transports carbon to depth", "alters sonar readings", "reduces ocean acidity", "warms the surface layer", 0, "Animals feeding at the surface and excreting at depth carry carbon downward."]]],
["Reading Tree Rings", "Botany", 3, "A temperate tree adds one ring a year: pale, fast-grown wood in spring, dark dense wood late in the season. Counting rings gives an age, but the width of each ring carries more information, since a tree grows wide rings in favourable years and narrow ones in drought.\n\nBecause all trees in a region experience the same weather, their ring patterns match. A distinctive sequence of narrow rings in a living tree can be found in the outer rings of an old beam, and in the inner rings of an older beam still. Chaining these overlaps backwards has produced continuous records reaching thousands of years.\n\nThe method has limits. Tropical trees growing in constant conditions may add no clear rings at all, and a tree stressed by insects can produce a narrow ring in a wet year.", [["What does the width of a tree ring primarily indicate?", "The tree's species", "The tree's height", "How favourable that year's conditions were", "The season of the year", 2, "Wide rings form in favourable years, narrow rings in drought."], ["How are records extended beyond the life of a single tree?", "By measuring trunk diameter", "By counting rings in tropical species", "By carbon dating each ring", "By matching overlapping patterns between samples", 3, "Distinctive sequences are matched between living trees and progressively older timber."], ["The passage mentions insect damage in order to", "describe a threat to forests", "argue the method is worthless", "explain why tropical trees lack rings", "show that ring width can mislead", 3, "A stressed tree can produce a narrow ring in a wet year, a limitation of the method."]]],
["Why Mars Lost Its Atmosphere", "Astronomy", 4, "Mars once had liquid water on its surface, which requires an atmosphere thick enough to keep it from boiling away. Today the atmospheric pressure is under one percent of Earth's. Where the air went is largely settled.\n\nEarth is wrapped in a magnetic field generated by motion in its molten core, and that field deflects the solar wind. Mars is smaller, cooled faster, and its core dynamo shut down early. With no field, the solar wind reached the upper atmosphere directly and stripped gas molecules away over hundreds of millions of years. Measurements from orbiting spacecraft have watched the process continuing today and allowed the historical rate to be estimated.\n\nSize, in other words, set the outcome: a smaller planet cooled sooner, lost its dynamo sooner, and lost its air.", [["What ultimately caused Mars to lose its atmosphere?", "Increased solar radiation", "Absorption of gases into the soil", "Loss of its magnetic field, exposing the atmosphere to the solar wind", "A collision with a large asteroid", 2, "With the dynamo shut down there was no field, and the solar wind stripped the atmosphere."], ["Why did Mars lose its core dynamo before Earth did?", "It has no moon", "It is farther from the sun", "It is smaller and cooled faster", "It rotates more slowly", 2, "The passage attributes the early shutdown to Mars being smaller and cooling faster."], ["The passage indicates that atmospheric loss on Mars", "is still occurring and has been measured", "cannot be estimated", "occurred in a single event", "stopped long ago", 0, "Orbiting spacecraft have watched the process continuing today."]]],
["The Grid Plan", "Architecture", 3, "Laying a city out on a grid is old and widespread. Miletus used one in the fifth century BCE, as did Chinese capitals, Roman colonies and Spanish colonial towns. The pattern recurs because it solves practical problems: land is easy to divide and sell, addresses are easy to find, and a surveyor can extend the plan indefinitely without redesigning it.\n\nThe costs are equally consistent. A grid ignores terrain, so San Francisco runs streets straight up hills that a curved road would have climbed gently. It offers no natural centre, since every intersection resembles every other. And it lengthens diagonal journeys, which is why cities with grids often acquire one or two diagonal avenues cut across them at great expense.\n\nThe grid is not a failure of imagination but a trade, chosen most often where land had to be distributed quickly.", [["According to the passage, grids are common because they", "follow terrain naturally", "are the most beautiful arrangement", "reduce the cost of construction", "make land easy to divide and extend", 3, "The passage lists easy division and sale, easy addressing, and indefinite extension."], ["Why does the passage mention San Francisco?", "To compare it with Miletus", "To praise its street design", "To show a grid ignoring terrain", "To describe a diagonal avenue", 2, "San Francisco illustrates streets running straight up hills a curved road would have climbed gently."], ["The final sentence characterises the grid as", "an unimaginative mistake", "a modern invention", "suitable only for flat land", "a deliberate trade-off", 3, "It calls the grid not a failure of imagination but a trade."]]],
["Equal Temperament", "Music", 4, "Two notes sound consonant when their frequencies form a simple ratio. A perfect fifth is three to two. Tuning a keyboard by stacking pure fifths, however, produces a problem: twelve pure fifths do not land exactly where seven octaves land, but slightly beyond, and the small surplus has to go somewhere.\n\nEarlier systems parked the error in one interval, leaving most keys sweetly in tune and one unusable, so-called wolf interval. Equal temperament instead divides the discrepancy evenly across all twelve semitones. Every fifth is then very slightly narrow, no interval except the octave is pure, and in exchange every key sounds identical in character and a player may modulate freely.\n\nThe gain was compositional. Music that travels through many keys, common after Bach, is practical only on an instrument tuned this way.", [["What problem does equal temperament solve?", "Instruments drifting out of tune with use", "Strings breaking under tension", "Notes being too closely spaced", "Twelve pure fifths not matching seven octaves", 3, "The surplus from stacking pure fifths is the discrepancy that must be distributed."], ["What is given up under equal temperament?", "Purity in every interval except the octave", "The ability to modulate", "The octave", "Consonance altogether", 0, "No interval except the octave is pure once the error is spread evenly."], ["According to the passage, the practical benefit was that", "tuning took less time", "music became slower", "instruments became cheaper", "every key sounds alike and modulation is free", 3, "Every key sounds identical in character and a player may modulate freely."]]],
["Why Ice Floats", "Chemistry", 2, "Almost every substance is denser as a solid than as a liquid, because cooling slows molecules and lets them pack more closely. Water reverses this, and the reason lies in the shape of its molecule.\n\nEach water molecule can form hydrogen bonds with four neighbours, but only at particular angles. In liquid water these bonds form and break constantly, and molecules slip into whatever gaps appear. On freezing, the bonds lock into a rigid lattice that holds each molecule at the required angle, and that arrangement contains more empty space than the liquid. Ice is therefore about nine percent less dense, and floats.\n\nThe consequence is ecological. A lake freezes from the top down, and the ice insulates the water beneath. Were ice denser, lakes would freeze from the bed upward and few temperate aquatic species would survive a winter.", [["Why is ice less dense than liquid water?", "It contains dissolved air", "Hydrogen bonds break on freezing", "Its rigid lattice contains more empty space", "Its molecules move faster", 2, "The locked lattice holds molecules at fixed angles and contains more empty space than the liquid."], ["According to the passage, what would happen if ice were denser than water?", "Lakes would never freeze", "Water would boil at a lower temperature", "Lakes would freeze from the bottom upward", "Ice would melt more slowly", 2, "The passage states lakes would freeze from the bed upward."], ["The word lattice in the passage refers to", "a chemical reaction", "a type of bond", "an ordered structural arrangement", "a measure of density", 2, "It describes the rigid ordered arrangement molecules lock into on freezing."]]],
["Pompeii and the Problem of Preservation", "Archaeology", 3, "Pompeii is often called a city frozen in time, but the phrase flatters the evidence. The eruption of 79 CE buried the town in ash, sealing streets, furniture and food, and that seal preserved an ordinary day with a completeness almost nowhere else achieves.\n\nYet what survives is a town in the middle of repairs. An earthquake seventeen years earlier had damaged many buildings, and a good deal of Pompeii was scaffolded, emptied or abandoned when the ash fell. Some houses were building sites rather than homes.\n\nExcavation added its own distortions. Early digs removed objects without recording where they lay, and material exposed to air after centuries underground decayed quickly. The site is extraordinary evidence, but evidence of a particular disrupted moment, recovered by methods that destroyed part of what they found.", [["What is the author's main reservation about the phrase frozen in time?", "Pompeii was a small settlement", "Ash does not preserve organic material", "The eruption date is uncertain", "The town was disrupted and partly abandoned when buried", 3, "The passage stresses that an earthquake had left much of the town under repair or empty."], ["According to the passage, early excavation was damaging because", "it used explosives", "it was carried out too slowly", "objects were removed without recording their positions", "it focused only on public buildings", 2, "Early digs removed objects without recording where they lay."], ["The passage suggests that exposure to air after excavation", "was necessary for dating", "had no measurable effect", "accelerated decay", "preserved delicate materials", 2, "Material exposed to air after centuries underground decayed quickly."]]],
["Herd Immunity", "Medicine", 3, "A pathogen needs new hosts. If enough of a population is immune, an infected person is likely to meet immune people and the chain of transmission breaks even though susceptible individuals remain. This indirect protection is called herd immunity.\n\nThe threshold depends on how contagious the pathogen is. A disease in which each case produces two further cases on average requires about half the population to be immune; measles, where one case can produce twelve, requires roughly ninety-five percent. Small drops in coverage therefore matter far more for highly contagious diseases.\n\nTwo assumptions are often overlooked. The calculation supposes immune people are mixed evenly through the population, and clusters of unvaccinated people can sustain outbreaks in a country whose average coverage looks safe. It also supposes immunity lasts, which for some pathogens it does not.", [["Herd immunity protects susceptible people by", "preventing pathogens from mutating", "making them immune indirectly", "interrupting chains of transmission", "curing them without treatment", 2, "Infected people mostly meet immune people, so transmission chains break."], ["Why does measles require such high coverage?", "Immunity to it fades quickly", "Its vaccine is less effective", "Each case can produce many further cases", "It spreads only among children", 2, "One measles case can produce twelve, raising the threshold to about ninety-five percent."], ["According to the passage, a country with safe average coverage may still see outbreaks because", "testing is inadequate", "the vaccine has expired", "the pathogen has mutated", "unvaccinated people cluster together", 3, "The calculation assumes even mixing; clusters can sustain outbreaks."]]],
["The Rise of the Novel", "Literature", 4, "The novel is a young form. Long prose fiction existed earlier, but the novel as it is now recognised, following ordinary people through plausible events in a specific time and place, emerged in eighteenth-century Europe alongside conditions that made it viable.\n\nCheap printing and rising literacy created a readership. Circulating libraries let a reader who could not afford a book borrow one, which made length commercially possible. And a growing middle class supplied both the audience and the subject, since the form takes private life seriously in a way epic and romance had not.\n\nThe novel also required a reader willing to spend many solitary hours with invented people. Contemporary critics worried about exactly that, warning that novel reading encouraged idleness and unreal expectations, particularly in young women.", [["What distinguishes the novel from earlier long prose fiction?", "Its religious subject matter", "Its greater length", "Its focus on ordinary people in plausible, specific settings", "Its use of verse", 2, "The passage defines the novel by ordinary people, plausible events, and a specific time and place."], ["According to the passage, circulating libraries mattered because they", "made long books affordable to readers", "trained readers to read silently", "censored unsuitable material", "published new authors", 0, "They let readers who could not afford books borrow them, making length commercially possible."], ["Contemporary critics objected that novels", "ignored the middle class", "were written by amateurs", "were too short", "encouraged idleness and unreal expectations", 3, "That is the warning the passage attributes to critics."]]],
["Urban Heat Islands", "Environmental science", 2, "A city is measurably warmer than the countryside around it, often by several degrees at night. Three mechanisms account for most of the difference.\n\nMaterials come first. Asphalt and masonry absorb solar energy through the day and release it slowly after dark, so a city cools far more slowly than open ground. Second, cities lack vegetation. A tree cools its surroundings by evaporating water from its leaves, and a paved surface does none of this. Third, cities generate heat directly, from engines, machinery and air conditioning, which cools interiors by moving heat outdoors.\n\nRemedies follow the causes: reflective roofing, street trees, and surfaces that let rain soak in rather than run off. None is expensive relative to a city's budget, and the measured effects are large.", [["Why does a city cool more slowly at night than open ground?", "It is more densely populated", "Its materials release stored heat slowly", "It is at a higher elevation", "It receives more sunlight", 1, "Asphalt and masonry absorb heat by day and release it slowly after dark."], ["According to the passage, air conditioning contributes to the effect because it", "requires paved surfaces", "moves heat from indoors to outdoors", "consumes electricity", "reduces vegetation", 1, "The passage notes it cools interiors by moving heat outdoors."], ["How does the passage characterise the remedies?", "Effective only in dry climates", "Still entirely untested", "Inexpensive relative to city budgets and effective", "Prohibitively expensive", 2, "None is expensive relative to a city's budget, and measured effects are large."]]],
["Falsifiability", "Philosophy of science", 4, "Karl Popper asked what separates science from other systems of belief, and rejected the obvious answer. Confirmation, he argued, is too easy: a theory flexible enough to explain any outcome will find support everywhere, and finding support proves little.\n\nHis criterion was falsifiability. A scientific claim must forbid something. Einstein's general relativity predicted that starlight passing the sun would bend by a specific amount, and a measurement of a different amount would have refuted it. That risk, Popper said, is what made it scientific, quite apart from whether it turned out to be true.\n\nThe criterion has been criticised as too strict. A failed prediction can often be blamed on an auxiliary assumption rather than the theory itself, and working scientists rarely abandon a productive theory on one bad result.", [["According to Popper, why is confirmation a poor criterion?", "It is difficult to obtain", "A sufficiently flexible theory can find support anywhere", "It applies only to physics", "It requires expensive equipment", 1, "Popper argued a theory that explains any outcome will find support everywhere."], ["Why does the passage cite the bending of starlight?", "To criticise Einstein", "To explain how telescopes work", "To give an example of a claim that forbade a specific outcome", "To show general relativity is true", 2, "The prediction could have been refuted by a different measurement, which is Popper's point."], ["What criticism of falsifiability does the passage report?", "It cannot be applied to astronomy", "Popper later abandoned it", "A failed prediction can be blamed on auxiliary assumptions", "It is too permissive", 2, "The final paragraph notes this, along with scientists' reluctance to abandon productive theories."]]],
["How Bees Communicate Distance", "Zoology", 3, "A returning honeybee performs a dance on the vertical comb that tells other foragers where she has fed. Direction is encoded by angle: the straight run of the dance departs from vertical by the same angle the food source departs from the sun.\n\nDistance is encoded by duration, and here the bee is measuring something less obvious than metres. Experiments in which bees flew through narrow tunnels lined with patterns showed they overestimated distance badly, because the walls streamed past quickly. Bees flown through tunnels with plain walls underestimated it. What the bee reports is not distance travelled but the total visual motion that passed her eyes on the way.\n\nThe measure works because in open country visual flow and distance correlate closely. It fails precisely where an experimenter breaks that correlation.", [["What does the duration of the straight run encode?", "The bee's estimate of distance", "The quality of the food", "The time of day", "The number of bees at the source", 0, "Distance is encoded by duration, though the bee is measuring visual flow."], ["Bees in patterned tunnels overestimated distance because", "the patterns confused their sense of direction", "the tunnels were longer than they appeared", "more visual motion passed their eyes", "they flew more slowly", 2, "Patterned walls streamed past quickly, inflating the visual flow the bee measures."], ["The passage indicates that the bee's method", "measures distance directly in metres", "works well because flow and distance normally correlate", "is unreliable in ordinary conditions", "depends on the position of the sun", 1, "In open country visual flow and distance correlate closely, so the measure works."]]],
["Why Cities Grew by Rivers", "Sociology", 2, "Before railways, water moved goods and land did not. A horse could haul perhaps a tonne over a road; the same horse on a towpath could pull thirty tonnes on a barge. Any settlement that needed to trade in bulk therefore grew where water was.\n\nRivers offered more than transport. They supplied drinking water, carried away waste, drove mills, and provided a defensible boundary. Sites at a river mouth, a ford, or the highest point a seagoing ship could reach were especially favoured, because goods had to change hands there and someone could tax the transfer.\n\nRailways broke the dependence within a few decades, and later road freight broke it further. The pattern nonetheless persists, because a city once established is expensive to move.", [["What is the passage's main explanation for riverside cities?", "Water transport was vastly more efficient than land transport", "Rivers were beautiful", "Rivers prevented disease", "Rivers marked political borders", 0, "The horse comparison establishes the efficiency gap as the central reason."], ["Why were fords and river mouths especially favoured?", "They were easiest to defend", "They were furthest from the sea", "Goods changed hands there and the transfer could be taxed", "They had the cleanest water", 2, "The passage states goods had to change hands there and someone could tax the transfer."], ["According to the passage, why do riverside cities remain important?", "Railways were never built there", "Rivers still power industry", "An established city is expensive to move", "Water transport is still cheapest", 2, "The final sentence gives exactly this reason."]]],
["The Trouble with Averages", "Mathematics", 3, "An average is a summary, and every summary discards information. Which information it discards determines when it misleads.\n\nThe arithmetic mean is sensitive to extreme values. A room of ten people with modest incomes has a mean income that a single billionaire walking in would multiply many times over, though nine of the eleven people present are no better off. The median, the middle value, is unaffected by that entrant, which is why income statistics usually report it.\n\nA subtler failure is averaging over groups that behave differently. If a treatment helps one group and harms another in equal measure, the average effect is zero and the honest conclusion, that the treatment matters a great deal, is exactly the one the summary hides.", [["Why do income statistics usually report the median?", "It is always higher than the mean", "It requires a smaller sample", "It is unaffected by extreme values", "It is easier to calculate", 2, "The median is unaffected by the billionaire entering the room."], ["What is the subtler failure the passage describes?", "Rounding errors", "Using too small a sample", "Averaging over groups that behave differently", "Confusing the mean with the mode", 2, "The final paragraph describes opposite effects in two groups cancelling to zero."], ["In the treatment example, the average effect of zero is misleading because it suggests", "the groups were identical", "the treatment has no importance", "the sample was biased", "the treatment is harmful", 1, "The honest conclusion is that the treatment matters a great deal, which the zero hides."]]],
["Lascaux and the Question of Purpose", "Archaeology", 4, "The painted caves of southern France and northern Spain contain some of the oldest known art, and almost every claim about why they were made is contested. The images are overwhelmingly of large animals. Humans are rare, crudely drawn, and often incomplete.\n\nOne early interpretation held the paintings to be hunting magic, images made to secure success in the hunt. The pattern of species undercuts it: the animals eaten most often, judging by bones in occupation layers, are not the animals most often painted.\n\nOther proposals treat the caves as places of ritual initiation, as records of myth, or as teaching aids. What can be said with confidence is narrower. The painters returned to the same chambers over long periods, worked deep underground by lamplight where no one lived, and took considerable trouble to do so.", [["What evidence weakens the hunting magic interpretation?", "No hunting scenes appear", "The caves were inhabited year-round", "The paintings are too recent", "The most eaten animals are not the most painted", 3, "Bones in occupation layers show a mismatch between diet and depicted species."], ["According to the passage, human figures in the caves are", "rare and crudely drawn", "absent entirely", "the most common subject", "painted in great detail", 0, "Humans are rare, crudely drawn and often incomplete."], ["What does the author say can be stated with confidence?", "That the caves were ritual sites", "That the painters worked repeatedly, deep underground, at considerable effort", "That the paintings record myths", "The purpose of the paintings", 1, "The final sentence lists exactly these observations as the secure conclusions."]]],
["The Antikythera Mechanism", "History", 4, "In 1901 sponge divers off the Greek island of Antikythera recovered a corroded lump of bronze from a first-century BCE shipwreck. It sat largely ignored for decades. X-ray and later computed tomography revealed at least thirty interlocking gears cut with triangular teeth.\n\nThe device modelled the heavens. Turning a handle advanced dials showing the positions of the sun and moon, the phase of the moon, the dates of eclipses and the four-year cycle of athletic games. One gear train reproduced the moon's varying speed across the sky using a pin-and-slot arrangement, a mechanical solution to an astronomical irregularity Greek astronomers had measured but could not explain.\n\nNothing of comparable complexity survives from the following fourteen centuries. Whether the mechanism was unique or merely the one example that happened to sink is unknown.", [["What did imaging technology reveal about the object?", "It was a navigational compass", "It contained at least thirty interlocking gears", "It was made of iron rather than bronze", "It was a decorative ornament", 1, "X-ray and CT scanning revealed at least thirty gears with triangular teeth."], ["The pin-and-slot arrangement was notable because it", "mechanically reproduced an irregularity astronomers could not explain", "allowed the device to be wound automatically", "reduced the number of gears required", "made the mechanism waterproof", 0, "It reproduced the moon's varying speed, an irregularity that had been measured but not explained."], ["What does the passage say about the mechanism's uniqueness?", "It was definitely unique", "It was copied for centuries afterwards", "Whether it was unique is unknown", "It was certainly one of many", 2, "The final sentence states this is unknown."]]],
["Convergent Evolution", "Biology", 3, "The eye of an octopus and the eye of a human are strikingly similar: a lens focuses light onto a layer of receptors inside a fluid-filled chamber. The two lineages last shared an ancestor that had nothing of the kind. Each arrived at the design independently, a pattern biologists call convergent evolution.\n\nThe details betray the separate origins. In the vertebrate eye the receptors face away from the light, and the nerve fibres leaving them must pass back through the retina, producing a blind spot. In the octopus the receptors face the light and the fibres leave behind them. There is no blind spot.\n\nConvergence suggests that for some problems the space of workable solutions is narrow. It also demonstrates that similarity of form is not by itself evidence of common ancestry.", [["What does the blind spot in the vertebrate eye demonstrate?", "That lenses are unnecessary", "That vertebrate eyes are more advanced", "That the two eyes evolved separately", "That octopuses see more colours", 2, "The differing arrangement of receptors and nerves reveals independent origins."], ["According to the passage, convergent evolution suggests", "that evolution proceeds at a constant rate", "that all species share a recent ancestor", "that eyes evolved only once", "that workable solutions to some problems are few", 3, "The passage says convergence suggests the space of workable solutions is narrow."], ["The passage warns that similarity of form", "is impossible to measure", "is not by itself evidence of common ancestry", "occurs only in marine animals", "always indicates shared ancestry", 1, "This is stated directly in the final sentence."]]],
["The Green Revolution", "Economics", 3, "Between the 1940s and the 1970s, wheat and rice yields in parts of Asia and Latin America rose several-fold. The central innovation was breeding: new dwarf varieties put their energy into grain rather than stalk, and their short stems did not collapse under a heavy head, which taller varieties did when heavily fertilised.\n\nThe varieties came as a package. High yields required fertiliser, reliable irrigation and pesticides, so the gains went disproportionately to farmers who could afford inputs and had access to water. Regions dependent on rain saw far less benefit.\n\nAggregate results were nonetheless dramatic. India shifted from importing grain to exporting it within two decades. The costs, depleted aquifers, salinisation from over-irrigation and a narrowing of crop genetic diversity, appeared later and remain.", [["Why were dwarf varieties important?", "They needed less water", "They grew faster than tall varieties", "They put energy into grain and did not collapse under fertiliser", "They resisted disease", 2, "The passage says short stems put energy into grain and did not collapse under a heavy head."], ["Why did benefits fall unevenly?", "The varieties suited only cold climates", "High yields required inputs not all farmers could afford", "The seeds were distributed by lottery", "Some regions refused the new seed", 1, "Gains went to farmers who could afford fertiliser, irrigation and pesticides."], ["According to the passage, the costs of the Green Revolution", "were fully avoided", "appeared later and persist", "were evident immediately", "were purely economic", 1, "Depleted aquifers, salinisation and reduced diversity appeared later and remain."]]],
["Placebo and Its Limits", "Medicine", 4, "Patients given an inert pill sometimes improve, and the effect is real enough that trials must control for it. What produces the improvement is less clear than the phrase placebo effect suggests.\n\nSeveral processes are bundled together in the term. Many conditions improve on their own, and a patient enrolls when symptoms are at their worst, so the next measurement is likely to be better regardless of treatment. Patients also report symptoms differently to a doctor who has just treated them. Genuine physiological responses occur too: expectation of pain relief measurably increases the release of the body's own opioids.\n\nThe distinction matters because the first two mechanisms change what is reported while the third changes what happens. Placebos reliably relieve pain and nausea. They do not shrink tumours.", [["Why must trials control for placebo effects?", "Doctors cannot be trusted", "Placebos are expensive", "Patients dislike inert pills", "Improvement can occur without active treatment", 3, "Patients given an inert pill sometimes improve, so trials must account for it."], ["What is the significance of distinguishing the three mechanisms?", "Only the first is genuine", "Two change what is reported, one changes what happens", "All three are equally powerful", "They apply to different diseases", 1, "The passage says the first two change what is reported while the third changes what happens."], ["According to the passage, placebos are effective for", "pain and nausea", "broken bones", "bacterial infection", "tumour reduction", 0, "Placebos reliably relieve pain and nausea but do not shrink tumours."]]],
["Why Languages Lose Cases", "Linguistics", 4, "Old English marked nouns for case: different endings signalled whether a noun was subject, object or possessor, and word order was correspondingly free. Modern English has almost none of this, keeping case only in pronouns, where he and him still differ.\n\nOne driver was phonetic. English stress falls early in the word, and unstressed final syllables erode over centuries. The endings that carried case information were exactly the syllables least likely to survive.\n\nOnce endings blurred, word order had to do the work, and once word order was doing the work the endings became redundant, which accelerated their loss. Contact with Old Norse, a related language with different endings but similar roots, is often thought to have hastened the process, since speakers could understand one another more easily by ignoring endings than by learning both sets.", [["What phonetic factor contributed to the loss of case endings?", "Vowels lengthened over time", "Unstressed final syllables eroded", "Consonants merged", "Stress shifted to the end of words", 1, "English stress falls early, so unstressed final syllables, which carried case, eroded."], ["The passage describes a self-reinforcing process in which", "word order took over, making endings redundant, hastening their loss", "pronouns replaced nouns", "endings were deliberately abolished", "word order and endings both grew more complex", 0, "Blurred endings forced word order to carry the load, which made endings redundant."], ["How may contact with Old Norse have contributed?", "Speakers understood each other better by ignoring endings", "It standardised spelling", "It introduced new endings", "It changed English stress patterns", 0, "Ignoring endings was easier than learning both sets."]]],
["The Physics of Skating", "Physics", 3, "The standard explanation for why ice is slippery is that pressure from the skate lowers the melting point and produces a film of water. The physics does not support it. A skater's weight on a blade lowers the melting point by a fraction of a degree, nowhere near enough to melt ice at typical rink temperatures.\n\nTwo better explanations operate together. Friction from the moving blade generates heat and melts a thin layer directly, which is why ice grows more slippery as you move faster. And the surface of ice is intrinsically disordered even well below freezing: the topmost molecules, bonded on one side only, remain mobile, forming a quasi-liquid layer that exists whether anything is standing on it or not.\n\nThe premelted layer explains why ice is slippery to a stationary shoe.", [["Why does the passage reject the pressure explanation?", "Ice does not melt under pressure", "Skate blades are too wide", "Rinks are kept too cold to skate on", "The melting point drop is far too small", 3, "A skater's weight lowers the melting point by only a fraction of a degree."], ["According to the passage, the quasi-liquid layer exists", "only in thick ice", "only under a moving blade", "only above freezing", "even when nothing touches the ice", 3, "The layer exists whether anything is standing on it or not."], ["Which observation does the premelted layer explain?", "Why rinks are resurfaced", "Why skates are sharpened", "Why ice forms at zero degrees", "Why ice is slippery to a stationary shoe", 3, "The final sentence states exactly this."]]],
["The Colosseum and Roman Concrete", "Architecture", 3, "Roman concrete has outlasted much of what came after it, and marine structures are the most striking case: harbour walls poured two thousand years ago stand while modern harbour concrete degrades within decades.\n\nThe recipe explains part of it. Romans mixed lime with volcanic ash, and the reaction produced a binder that continues to react with seawater rather than being attacked by it. Analysis has found crystals growing inside the ancient concrete that formed long after pouring, sealing cracks as they appeared.\n\nSurvivorship complicates the comparison. The Roman structures still standing are the ones that did not fail, and a great deal of Roman concrete has vanished. Modern concrete is also reinforced with steel, which the Romans lacked, and steel corrodes and splits the concrete around it. The ancient material lasts partly because it asks less of itself.", [["What property of Roman marine concrete does the passage emphasise?", "Its resistance to fire", "Its continuing reaction with seawater, sealing cracks", "Its high initial strength", "Its low cost", 1, "Crystals forming long after pouring seal cracks as they appear."], ["Why does the passage mention survivorship?", "To argue Roman concrete was poorly made", "To date the Colosseum", "Because surviving structures are the ones that did not fail", "To explain volcanic ash supply", 2, "Comparison is skewed because much Roman concrete has vanished."], ["According to the passage, steel reinforcement", "corrodes and splits the surrounding concrete", "makes modern concrete last longer", "was used by the Romans", "prevents cracking entirely", 0, "Steel corrodes and splits the concrete around it."]]],
["Migration and the Magnetic Sense", "Zoology", 4, "Some birds navigate over thousands of kilometres, at night, in their first year, without a parent to follow. Several cues are combined, and one of them is the earth's magnetic field.\n\nEvidence for the sense is strong. Birds held in cages orient in their migratory direction, and reverse it when an artificial field is reversed around them. The mechanism is less settled. One leading proposal involves cryptochrome, a light-sensitive protein in the retina, in which a magnetic field alters the lifetime of a short-lived pair of radicals and thus the chemical signal reaching the brain. This predicts, correctly, that the sense should depend on light.\n\nA second candidate involves magnetite, an iron mineral found in some birds' tissue. The two are not exclusive, and evidence suggests different species may weight them differently.", [["What experimental result supports a magnetic sense?", "Birds avoid areas with iron deposits", "Birds follow their parents on first migration", "Caged birds reverse orientation when the field is reversed", "Birds navigate better in daylight", 2, "Reversing an artificial field reverses the birds' orientation."], ["The cryptochrome proposal predicts that the magnetic sense", "operates only at night", "requires iron in the tissue", "depends on light", "works only near the poles", 2, "The proposal correctly predicts that the sense should depend on light."], ["According to the passage, the two proposed mechanisms", "apply only to young birds", "have both been disproved", "cannot both be correct", "may both operate, weighted differently by species", 3, "The two are not exclusive and species may weight them differently."]]],
["The Invention of the Zero", "Mathematics", 4, "Zero entered mathematics twice, in two distinct roles. As a placeholder it is old: Babylonian scribes used a mark to show an empty position, so that sixty-one could be told from three thousand six hundred and one. That mark was punctuation rather than a number, and never stood alone.\n\nZero as a quantity, something that could be added, subtracted and reasoned about, appears in India by the seventh century, where Brahmagupta set out rules for arithmetic with it. His rules for addition and subtraction match modern practice; his treatment of division by zero does not, and the problem resisted a satisfactory answer for a further thousand years.\n\nThe distinction matters. A placeholder makes notation efficient. A number makes negative quantities and eventually algebra coherent.", [["What distinguishes the two roles of zero?", "One is Babylonian, the other Greek", "One is written, the other spoken", "One is used in arithmetic, the other in geometry", "One marks an empty position, the other is a quantity to reason about", 3, "The passage contrasts placeholder punctuation with zero as an operable number."], ["According to the passage, Brahmagupta's rules", "were never written down", "were entirely correct by modern standards", "concerned only geometry", "matched modern practice except for division", 3, "His addition and subtraction rules match; his treatment of division by zero does not."], ["Why does the passage say the distinction matters?", "Placeholders are harder to write", "Zero is not a real number", "Babylonian notation was inefficient", "A number makes negatives and algebra coherent", 3, "The final sentence gives exactly this contrast."]]],
["Why Deserts Form Where They Do", "Geology", 3, "The great deserts cluster around thirty degrees north and south, and the pattern is atmospheric rather than accidental. Air heated at the equator rises, sheds its moisture as rain, and travels poleward at altitude. Around thirty degrees it descends, and descending air warms and takes up moisture rather than releasing it. The result is a belt of dry, stable air.\n\nTwo other mechanisms produce deserts elsewhere. A mountain range forces air upward, which rains on the windward slope and descends dry on the other, leaving a rain shadow. And a cold ocean current along a coast chills the air above it, suppressing the convection that would otherwise carry moisture inland, which is why the Atacama sits beside an ocean and receives almost no rain.\n\nDistance from any ocean produces a fourth kind.", [["Why is descending air dry?", "It contains no dust for droplets", "It moves too quickly to collect moisture", "It is colder than surrounding air", "It has already lost moisture and warms as it sinks", 3, "Air sheds moisture at the equator, and descending air warms and takes up moisture instead of releasing it."], ["The Atacama is dry despite being coastal because", "it is far from any ocean", "a cold current suppresses convection", "it lies at thirty degrees south", "a mountain range blocks the sea", 1, "A cold current chills the air and suppresses the convection that would carry moisture inland."], ["A rain shadow forms when", "two air masses collide", "air rains on a windward slope and descends dry", "a coast faces a warm current", "air rises at the equator", 1, "That is the described mechanism."]]],
["Photography and Painting", "Art history", 3, "When photography became practical in the 1840s, portrait painters lost much of their trade almost at once. A likeness that had taken sittings and a substantial fee could be had in minutes for a fraction of the cost.\n\nThe usual account holds that painting responded by abandoning representation, and that impressionism and what followed were made possible by photography relieving painting of the duty to record. There is something to this, though the chronology is loose and painters had been moving in that direction already.\n\nA subtler influence ran the other way. Early photographs, with their long exposures, blurred anything that moved and cropped figures arbitrarily at the frame edge. Painters began to imitate those accidents deliberately, and the off-centre composition and cut-off figure entered painting from the camera rather than the other way round.", [["What is the usual account of photography's effect on painting?", "It had no measurable effect", "It freed painting from the duty to record appearances", "It improved painters' technique", "It made painting obsolete", 1, "The passage summarises the usual account as photography relieving painting of the duty to record."], ["How does the author qualify that account?", "By arguing portraits remained profitable", "By noting the chronology is loose and painters were already moving that way", "By dating photography to the 1870s", "By denying photography mattered", 1, "The passage says there is something to it, though chronology is loose and painters had already begun."], ["What influence does the author call subtler?", "Painters imitating photographic accidents like blur and cropping", "The decline of portrait fees", "The invention of colour film", "Photographers imitating painters", 0, "Off-centre composition and cut-off figures entered painting from the camera."]]],
["Fermentation and Food Preservation", "Chemistry", 2, "Fermentation preserves food by making it inhospitable. Bacteria or yeasts consume the sugars present and produce acid or alcohol, and the resulting environment stops most spoilage organisms from growing. Cabbage becomes sauerkraut when lactic acid bacteria drop its acidity below the point where competitors survive.\n\nThe method is old, widespread and was arrived at independently in most inhabited regions, which is unsurprising given that it requires no equipment and happens spontaneously in the right conditions. What varies is control. Salt regulates which organisms flourish, temperature sets the pace, and excluding air favours the organisms that do not need it.\n\nFermentation also changes food beyond preserving it. It breaks down compounds that are hard to digest, produces vitamins absent in the raw material, and generates flavours that no fresh ingredient contains.", [["How does fermentation prevent spoilage?", "By killing all microorganisms", "By creating conditions in which spoilage organisms cannot grow", "By sealing food from air permanently", "By removing all moisture", 1, "Acid or alcohol makes the environment inhospitable to most spoilage organisms."], ["According to the passage, salt is used to", "remove acid", "add flavour only", "raise the temperature", "regulate which organisms flourish", 3, "The passage lists salt as regulating which organisms flourish."], ["The passage indicates fermentation independently arose in most regions because it", "required advanced knowledge", "needs no equipment and occurs spontaneously", "was spread by trade", "depended on specific climates", 1, "It requires no equipment and happens spontaneously in the right conditions."]]],
["The Broken Windows Debate", "Sociology", 4, "In 1982 two social scientists proposed that visible disorder, broken windows, graffiti, uncollected rubbish, signals that a neighbourhood is unmonitored, and that the signal invites more serious crime. The policy conclusion drawn was that attending to minor disorder would prevent major offences.\n\nSeveral cities adopted the approach, and crime fell in the following years. Whether the policy caused the fall is disputed, because crime fell in cities that adopted it and cities that did not, over the same period, which points to some common cause.\n\nField experiments give the underlying psychology partial support: people litter more in an already littered environment. But the step from that finding to a policing strategy is long, and critics argue the strategy in practice concentrated enforcement on minor offences in poor neighbourhoods without touching the causes of serious crime.", [["What was the original proposal?", "That visible disorder signals an unmonitored area and invites crime", "That policing budgets should rise", "That crime is caused by poverty alone", "That graffiti is a form of art", 0, "The 1982 proposal linked visible disorder to a signal that invites more serious crime."], ["Why is the causal claim disputed?", "No city ever adopted it", "Crime rose in cities that adopted the policy", "The data were never collected", "Crime also fell in cities that did not adopt it", 3, "Crime fell in both adopting and non-adopting cities, suggesting a common cause."], ["What do field experiments show?", "Partial support for the psychology, as people litter more where litter exists", "That disorder has no effect on behaviour", "That graffiti reduces crime", "That the policing strategy works", 0, "The passage reports partial support for the underlying psychology."]]],
["Why We Forget", "Psychology", 3, "Forgetting is often treated as a failure of memory, but the evidence suggests it is partly a function of it. A system that retained everything would have to search everything, and relevance would be buried in detail.\n\nSome forgetting is decay, a trace weakening when it is not used. More is interference. New learning competes with old: a person who has moved house repeatedly recalls the current address readily and the previous ones poorly, not because the older traces have vanished but because the newer ones win the competition to be retrieved.\n\nRetrieval itself is selective in a way that shapes what remains. Recalling one item actively suppresses related items that compete with it, so the act of remembering one thing makes neighbouring things harder to reach. Memory is edited by use, not merely worn away by time.", [["What is the passage's central claim about forgetting?", "It is always a malfunction", "It can be entirely prevented", "It is partly a useful function of memory", "It occurs only with age", 2, "The opening states a system retaining everything would bury relevance in detail."], ["The house address example illustrates", "decay over time", "damage to the brain", "deliberate suppression", "interference from newer learning", 3, "Newer traces win the competition to be retrieved, which is interference."], ["According to the passage, recalling one item", "strengthens all related items", "has no effect on other memories", "erases the item recalled", "suppresses competing related items", 3, "Recalling one item actively suppresses related competitors."]]],
["Containerisation", "Economics", 3, "Before the 1960s, loading a ship meant handling cargo piece by piece. Gangs of dockers moved barrels, sacks and crates into holds, a ship might spend longer in port than at sea, and loading could account for a substantial share of the cost of shipping a good.\n\nThe shipping container removed the handling. A sealed steel box could be filled inland, lifted by crane, stacked, and moved to a lorry or railcar without being opened. Port time collapsed from weeks to hours and costs fell by an order of magnitude.\n\nThe consequences reached far beyond ports. When moving a good across an ocean costs little, manufacturing can be sited far from where products are sold, and supply chains can be split across continents. Container shipping did not cause globalisation on its own, but little of it would have been affordable without it.", [["What was the main inefficiency before containerisation?", "Cargo was handled piece by piece", "Ports were too few", "Ships were too small", "Crews were poorly trained", 0, "Gangs of dockers moved barrels, sacks and crates individually."], ["According to the passage, the container's key advantage was that goods", "could be shipped faster at sea", "could be taxed more easily", "were protected from weather", "did not need to be handled between modes of transport", 3, "A sealed box moved between ship, lorry and railcar without being opened."], ["How does the passage characterise containerisation's role in globalisation?", "It slowed globalisation", "It did not cause it alone, but little would have been affordable without it", "It was neither necessary nor important", "It was the sole cause", 1, "The final sentence makes exactly this qualified claim."]]],
["Bird Song and Dialect", "Zoology", 3, "A white-crowned sparrow raised in silence produces a crude, unstructured song. Raised where it can hear adults of its species during a limited window in its first months, it produces the full song of its region, and the regions differ enough that a trained listener can place a bird within a few kilometres.\n\nThe learning is constrained. A sparrow exposed to the song of another species during the same window does not learn it. The bird appears to arrive with a template specific enough to reject the wrong model and loose enough to absorb local variation within the right one.\n\nThe parallel with human language is close but should not be pushed far. Song serves narrow functions, chiefly attracting mates and defending territory, and cannot be recombined to express anything new.", [["What happens to a sparrow raised without hearing adult song?", "It sings the regional dialect anyway", "It learns another species' song", "It produces a crude, unstructured song", "It produces no song at all", 2, "The passage says it produces a crude, unstructured song."], ["What does the rejection of other species' song suggest?", "The bird cannot hear other species", "The bird has an inborn template specific to its species", "Song is entirely learned", "The learning window is very long", 1, "The template is specific enough to reject the wrong model."], ["Why does the author caution against pushing the language parallel?", "Songs are identical across regions", "Birds cannot hear well", "Humans also learn in a window", "Song serves narrow functions and cannot express new content", 3, "Song chiefly attracts mates and defends territory and cannot be recombined."]]],
["The Library of Alexandria", "History", 3, "The Library of Alexandria is usually remembered for its destruction, and the story is generally told as a single catastrophe. The evidence suggests something slower and less dramatic.\n\nCaesar's troops burned part of the harbour district in 48 BCE and probably destroyed a warehouse of scrolls. The Museum survived. Later centuries brought civil conflict, the withdrawal of royal patronage that had paid for copying and acquisition, and the gradual departure of scholars to other cities.\n\nA library is not only a building. It is a budget, a staff of copyists, and a network that finds and reproduces texts, and papyrus decays within a few centuries in the Egyptian climate unless continually recopied. Once the funding stopped, the collection was dying whether or not anything burned. Institutions of this kind usually end by neglect rather than by fire.", [["What is the passage's main argument?", "Caesar destroyed the entire library", "The library never existed", "Papyrus is more durable than parchment", "The library declined gradually rather than in one catastrophe", 3, "The passage argues for a slower decline through lost funding and departing scholars."], ["Why does the passage stress that papyrus decays?", "To date the library's founding", "To argue fire was impossible", "To explain why copying had to be continuous", "To compare Egypt with Greece", 2, "Papyrus decays unless continually recopied, so a collection needs ongoing funding."], ["According to the passage, a library consists of", "a budget, staff and acquisition network", "only its rarest texts", "a building alone", "its founding charter", 0, "The passage explicitly lists these components."]]],
["Antibiotic Resistance", "Medicine", 3, "Resistance is not caused by antibiotics; it is revealed by them. In any large bacterial population a few individuals carry mutations that happen to blunt a drug's effect. Treatment kills the susceptible majority and leaves those few to multiply without competition.\n\nBacteria also trade resistance directly. Genes conferring it often sit on plasmids, small rings of DNA that can pass between cells and even between species, so resistance acquired in one population can appear in an unrelated one without descent.\n\nThe practical consequences follow from the mechanism. Finishing a course matters because a partial course may leave the least susceptible survivors. Using antibiotics for viral infections applies selection pressure with no possible benefit. And agricultural use, where drugs are given routinely to healthy animals, maintains that pressure on an enormous scale.", [["According to the passage, antibiotics contribute to resistance by", "spreading plasmids between species", "removing susceptible bacteria and leaving resistant ones to multiply", "weakening the immune system", "causing mutations in bacteria", 1, "Treatment kills the susceptible majority, leaving resistant individuals without competition."], ["Why can resistance appear in unrelated bacterial species?", "They mutate identically", "Antibiotics affect all species equally", "Plasmids carry resistance genes between cells and species", "They share the same habitat", 2, "Plasmids can pass between cells and even between species."], ["Why is using antibiotics against viral infections criticised?", "It weakens the drug chemically", "Viruses become resistant", "It applies selection pressure with no possible benefit", "It is expensive", 2, "The passage states exactly this."]]],
["Cartography and Projection", "Geography", 4, "Every flat map of the earth is wrong, and necessarily so. A sphere cannot be laid flat without stretching, so a projection must choose which property to preserve and which to sacrifice.\n\nMercator preserves angles. A course of constant compass bearing appears as a straight line, which is why it became the navigator's map and why it survives on screens today. The cost is area: land near the poles is inflated enormously, and Greenland appears comparable to Africa when Africa is fourteen times larger.\n\nEqual-area projections such as Gall-Peters preserve relative size and distort shape instead, stretching continents into unfamiliar outlines. Neither is more correct. The relevant question is what the map is for, and a projection that answers one purpose well will answer another badly.", [["Why must every flat map distort the earth?", "Paper sizes are standardised", "A sphere cannot be flattened without stretching", "Surveying is imprecise", "Projections are chosen arbitrarily", 1, "The passage states a sphere cannot be laid flat without stretching."], ["What does the Mercator projection sacrifice?", "Coastline detail", "Angles", "Accurate relative area", "Compass bearings", 2, "Mercator preserves angles at the cost of area, inflating polar land."], ["What conclusion does the passage draw about choosing a projection?", "All projections are equally useful", "Equal-area projections are correct", "Mercator should be abandoned", "The right choice depends on the map's purpose", 3, "The relevant question is what the map is for."]]],
["Volcanic Winters", "Environmental science", 4, "A large eruption can cool the planet, but not through ash, which falls out within weeks. The agent is sulphur dioxide injected into the stratosphere, where it forms fine sulphate droplets that reflect sunlight and remain aloft for a year or more.\n\nThe eruption of Tambora in 1815 produced the following year without a summer. Snow fell in New England in June, harvests failed across Europe, and grain prices rose steeply. The connection was not understood at the time and was reconstructed much later from ice cores, which preserve the sulphate signal in datable layers.\n\nHeight matters more than size. An eruption that spreads ash widely but does not reach the stratosphere has little climatic effect, while a smaller eruption that punches through has a disproportionate one.", [["What causes the cooling effect of a large eruption?", "Ash blocking sunlight for years", "Carbon dioxide release", "Lava absorbing heat", "Sulphate droplets in the stratosphere reflecting sunlight", 3, "Ash falls out within weeks; sulphate droplets remain aloft and reflect sunlight."], ["How was the Tambora connection established?", "From ice cores preserving a datable sulphate signal", "From tree rings alone", "From eyewitness paintings", "From contemporary scientific reports", 0, "The connection was reconstructed later from ice cores."], ["According to the passage, the key factor in climatic impact is", "the eruption's latitude", "whether the plume reaches the stratosphere", "the duration of the eruption", "the volume of lava", 1, "Height matters more than size; reaching the stratosphere is decisive."]]],
["The Sunk Cost Fallacy", "Psychology", 3, "A rational decision about whether to continue a project depends only on its future costs and benefits. Money already spent cannot be recovered by continuing, so it should not enter the calculation. People nonetheless weigh it heavily.\n\nIn a well-known demonstration, participants who had paid for a theatre ticket were more likely to attend in a snowstorm than participants given the same ticket free. The discomfort of the journey and the value of the performance were identical; only the irrecoverable payment differed.\n\nExplanations vary. The behaviour may reflect an aversion to appearing wasteful, or a reluctance to admit an earlier decision was mistaken. Whatever the cause, it scales: governments and firms continue failing projects for the reason that so much has already been spent, which is the one consideration that should carry no weight at all.", [["Why should sunk costs be excluded from a decision?", "They are recorded elsewhere", "They are usually small", "They are hard to measure", "They cannot be recovered by continuing", 3, "Money already spent cannot be recovered by continuing."], ["What did the theatre ticket experiment isolate?", "The effect of an irrecoverable payment on the decision", "The cost of travel in snow", "The value people place on performances", "The effect of weather on attendance", 0, "Discomfort and value were identical; only the payment differed."], ["The final sentence makes the point that", "large organisations avoid the fallacy", "the one consideration given most weight should carry none", "governments spend more than firms", "projects should never be abandoned", 1, "It notes the reason cited is precisely the one that should carry no weight."]]],
["Terracing and Soil", "Environmental science", 2, "Farming a steep slope invites erosion. Rain running downhill carries topsoil with it, and topsoil is the layer that holds nutrients and water. A field can lose in one storm what took centuries to accumulate.\n\nTerracing answers this by cutting the slope into a staircase of level platforms held by walls or banks. Water reaching a terrace slows, spreads and soaks in rather than running off, and the soil stays where it is. Systems in the Andes and in the rice-growing regions of East and Southeast Asia have been cultivated continuously for many centuries.\n\nThe requirement is maintenance. A terrace wall that fails concentrates water on the terrace below and can trigger a cascade, so terraced landscapes tend to be abandoned all at once rather than gradually when the labour to maintain them disappears.", [["Why is the loss of topsoil especially damaging?", "It holds nutrients and water", "It is the deepest layer", "It is the hardest to plough", "It prevents flooding", 0, "Topsoil is the layer that holds nutrients and water."], ["How does a terrace reduce erosion?", "By slowing water so it soaks in rather than running off", "By covering the soil with stone", "By diverting rain away from the field", "By reducing rainfall", 0, "Water reaching a terrace slows, spreads and soaks in."], ["Why are terraced landscapes abandoned suddenly?", "The soil is exhausted at once", "Terraces are legally protected", "A failed wall can trigger a cascade of failures", "Rainfall changes abruptly", 2, "A failed wall concentrates water below and can trigger a cascade."]]],
["Why Metals Conduct", "Physics", 3, "In most solids the electrons are held to particular atoms. In a metal the outermost electrons are not: they occupy states spread through the whole crystal and move freely, which is why a metal conducts electricity and heat and why it is shiny, since mobile electrons re-emit the light that strikes them.\n\nResistance comes from the lattice. A perfectly regular array of atoms would not scatter the electrons at all, but atoms vibrate with heat, and the vibrations disturb the regularity. Heating a metal therefore increases its resistance, which is the opposite of what happens in a semiconductor, where heating frees additional carriers and conductivity rises.\n\nCooling towards absolute zero reduces vibration and resistance falls, and in some materials it vanishes entirely below a critical temperature, a separate phenomenon with a different explanation.", [["Why is a metal shiny?", "Its atoms are closely packed", "Mobile electrons re-emit light striking the surface", "Its surface is smooth", "It reflects heat as well as light", 1, "Mobile electrons re-emit the light that strikes them."], ["Why does heating a metal increase resistance?", "Electrons become bound to atoms", "Electrons are destroyed", "The metal expands", "Atomic vibrations disturb the lattice regularity", 3, "Vibrations disturb the regularity, scattering electrons."], ["How do semiconductors differ under heating?", "Their resistance also rises", "They become magnetic", "They stop conducting entirely", "Heating frees additional carriers and conductivity rises", 3, "The passage contrasts this directly with metals."]]],
["The Printing Press and Standard Spelling", "Linguistics", 3, "English spelling was once flexible. A scribe wrote as he heard, and the same word might appear several ways on one page without anyone objecting.\n\nPrinting changed the economics. A printer setting type wanted a single form to reuse, compositors were often trained on the same texts, and printed books circulated far beyond the region where they were set, so one region's forms spread. Spelling settled towards a standard within roughly a century and a half.\n\nThe timing was unfortunate. The standard fixed during and just after a period of rapid change in English pronunciation, and spelling stopped moving while speech continued. That is why knight retains letters for sounds that were pronounced when the spelling was set and have since disappeared, and why English spelling records a pronunciation that no living speaker uses.", [["Why did printers favour consistent spelling?", "Readers demanded it", "The law required it", "A single form could be reused and set more efficiently", "Paper was expensive", 2, "A printer setting type wanted a single form to reuse."], ["Why does the passage call the timing unfortunate?", "Too few books were printed", "Printers used a foreign standard", "Printing arrived too late", "Spelling froze while pronunciation continued changing", 3, "The standard fixed while pronunciation kept changing."], ["The word knight is cited to show", "a foreign borrowing", "an inconsistent printer", "letters preserving sounds no longer pronounced", "a spelling error", 2, "It retains letters for sounds pronounced when the spelling was set."]]],
["Cooperative Hunting", "Zoology", 3, "Several predators hunt in groups, but grouping alone is not cooperation. Wolves and lions often simply converge on the same prey, each acting for itself, and the apparent coordination is a by-product.\n\nStricter evidence requires individuals taking different roles. Some lionesses reliably circle to drive prey while others wait in ambush, and they keep those roles across hunts. Harris's hawks hunt in relays, one flushing prey from cover while others wait above.\n\nCooperation raises a problem it does not solve: a group member that contributes nothing still eats. Where this has been examined, the answer is usually that participation is observable and that non-participants are tolerated less. The mechanism sustaining cooperation is therefore rarely generosity, and usually the cost of being seen not to help.", [["What distinguishes cooperation from mere grouping?", "Hunting at night", "The number of animals involved", "Sharing food afterwards", "Individuals taking consistent, different roles", 3, "Stricter evidence requires individuals taking different roles and keeping them."], ["What problem does cooperative hunting create?", "A member that contributes nothing still eats", "Groups grow too large", "Prey become harder to find", "Roles cannot be learned", 0, "The passage identifies the free-rider problem explicitly."], ["According to the passage, cooperation is usually sustained by", "generosity between group members", "kinship alone", "strict hierarchy", "the cost of being seen not to help", 3, "The mechanism is rarely generosity and usually the cost of being seen not to help."]]],
["Glass and the Telescope", "History", 4, "The telescope required a material problem to be solved before an optical one. Useful lenses need glass that is clear, free of bubbles and uniform in density, and for most of history glass was none of these.\n\nVenetian glassmakers on Murano developed cristallo in the fifteenth century, a soda glass of unusual clarity, and their techniques spread despite determined efforts to keep them secret. By the early seventeenth century, glass adequate for grinding into lenses was available across northern Europe, and the telescope appeared in the Netherlands in 1608 in the hands of spectacle makers rather than astronomers.\n\nGalileo heard a description, built his own within months and improved it, and turned it upward. The instrument that reshaped astronomy was, in its origins, a by-product of the spectacle trade.", [["What material obstacle delayed the telescope?", "Glass that was clear, bubble-free and uniform", "The absence of mathematics", "The cost of metal frames", "A lack of grinding tools", 0, "Useful lenses need such glass, and for most of history glass was none of these."], ["Who first built the telescope, according to the passage?", "Dutch spectacle makers", "Venetian glassmakers", "Galileo", "Astronomers in Padua", 0, "It appeared in the Netherlands in 1608 in the hands of spectacle makers."], ["What is the author's point in the final sentence?", "A transformative instrument originated in an unrelated trade", "The Dutch suppressed the invention", "Galileo deserves no credit", "Spectacles were more important than telescopes", 0, "The instrument that reshaped astronomy was a by-product of the spectacle trade."]]],
